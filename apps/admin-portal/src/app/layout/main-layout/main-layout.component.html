<div class="flex h-screen overflow-hidden bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 relative transition-colors duration-200">
  <!-- Desktop Sidebar -->
  <aside class="w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hidden md:flex flex-col transition-colors duration-200">
    <wfm-sidebar class="h-full"></wfm-sidebar>
  </aside>

  <!-- Mobile Sidebar Overlay & Drawer -->
  @if (mobileSidebarOpen()) {
    <!-- Backdrop overlay -->
    <div 
      (click)="toggleSidebar()"
      class="md:hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-40 transition-opacity duration-300 animate-in fade-in"
    ></div>

    <!-- Sliding Sidebar Drawer -->
    <aside 
      class="md:hidden fixed inset-y-0 left-0 w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 z-50 flex flex-col transition-transform duration-300 animate-in slide-in-from-left"
    >
      <wfm-sidebar class="h-full" (click)="toggleSidebar()"></wfm-sidebar>
    </aside>
  }

  <!-- Main container -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <wfm-header (toggleSidebar)="toggleSidebar()"></wfm-header>

    <!-- Client Presentation Mode Active Notice Bar -->
    @if (themeService.presentationMode()) {
      <div class="bg-amber-500/10 dark:bg-amber-950/40 border-b border-amber-500/20 px-6 py-2 flex items-center justify-between text-xs text-amber-800 dark:text-amber-300 shrink-0">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
          <span class="font-bold">Client Presentation Mode Active</span>
          <span class="hidden sm:inline text-slate-500 dark:text-slate-400">— Internal supplier costs and confidential margins are masked.</span>
        </div>
        <button
          type="button"
          (click)="themeService.togglePresentationMode()"
          class="px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-lg text-[11px] transition shadow-2xs"
        >
          Exit Client Mode
        </button>
      </div>
    }

    <!-- Main content area -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 bg-slate-50 dark:bg-slate-950 transition-colors duration-200">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Global Command Palette Modal (Ctrl + K) -->
  <wfm-command-palette></wfm-command-palette>

  <!-- Global Interior & Commercial Quick-Tools Drawer (Ctrl + J) -->
  <wfm-quick-tools-drawer></wfm-quick-tools-drawer>

  <!-- Floating Quick Actions Speed Dial (Bottom Right) -->
  <div class="fixed bottom-6 right-6 z-40 flex flex-col items-end gap-2 select-none">
    @if (speedDialOpen()) {
      <!-- Speed Dial Options -->
      <div class="flex flex-col items-end gap-2 mb-1 animate-in fade-in slide-in-from-bottom-2 duration-150">
        <!-- Option: Quick Tools -->
        <button
          type="button"
          (click)="quickToolsService.open('estimator'); speedDialOpen.set(false)"
          class="flex items-center gap-2 px-3 py-2 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 text-xs font-semibold transition group cursor-pointer"
        >
          <span class="group-hover:text-amber-500 dark:group-hover:text-amber-400">Area & Margin Calculator</span>
          <span class="w-7 h-7 rounded-lg bg-amber-100 dark:bg-amber-900/60 text-amber-700 dark:text-amber-400 flex items-center justify-center text-xs">📐</span>
        </button>

        <!-- Option: Command Palette -->
        <button
          type="button"
          (click)="commandPaletteService.open(); speedDialOpen.set(false)"
          class="flex items-center gap-2 px-3 py-2 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 text-xs font-semibold transition group cursor-pointer"
        >
          <span class="group-hover:text-amber-500 dark:group-hover:text-amber-400">Command Search</span>
          <span class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 flex items-center justify-center text-xs font-bold">⌘</span>
        </button>

        <!-- Option: Dark Mode Toggle -->
        <button
          type="button"
          (click)="themeService.toggleDarkMode(); speedDialOpen.set(false)"
          class="flex items-center gap-2 px-3 py-2 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 text-xs font-semibold transition group cursor-pointer"
        >
          <span class="group-hover:text-amber-500 dark:group-hover:text-amber-400">{{ themeService.isDark() ? 'Light Mode' : 'Dark Mode' }}</span>
          <span class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 flex items-center justify-center text-xs">
            {{ themeService.isDark() ? '☀️' : '🌙' }}
          </span>
        </button>
      </div>
    }

    <!-- Main Floating Trigger Button -->
    <button
      type="button"
      (click)="toggleSpeedDial()"
      [class.rotate-45]="speedDialOpen()"
      class="w-12 h-12 rounded-2xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-black shadow-xl shadow-amber-500/25 flex items-center justify-center transition-all duration-200 focus:outline-none cursor-pointer"
      title="Quick ERP Features & Tools"
    >
      <svg class="w-6 h-6 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6" />
      </svg>
    </button>
  </div>
</div>
