<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script>
window.addEventListener('error',function(e){if(e.message&&/ResizeObserver loop/.test(e.message)){e.stopImmediatePropagation();e.preventDefault();}});
if(window.Chart&&Chart.defaults){Chart.defaults.maintainAspectRatio=false;Chart.defaults.animation=false;}
/* Offline fallback: if the Chart.js CDN script could not be loaded (blocked network, wrong URL, file:// sandbox),
   provide a small built-in canvas implementation of the line / bar / doughnut charts used by the dashboard. */
if(typeof window.Chart==='undefined'){
(function(){
  function Chart(canvas,cfg){
    this.canvas=canvas; this.cfg=cfg; this._draw=this._draw.bind(this);
    var self=this;
    if(window.ResizeObserver){ var raf=0,lw=0; this._ro=new ResizeObserver(function(){ var w=canvas.parentNode.clientWidth; if(Math.abs(w-lw)<1) return; lw=w; cancelAnimationFrame(raf); raf=requestAnimationFrame(function(){self._draw();}); }); this._ro.observe(canvas.parentNode); }
    else window.addEventListener('resize',this._draw);
    this._draw();
  }
  Chart.prototype.destroy=function(){ if(this._ro) this._ro.disconnect(); else window.removeEventListener('resize',this._draw); };
  Chart.prototype._draw=function(){
    var c=this.canvas, cfg=this.cfg, o=cfg.options||{}, sc=o.scales||{};
    var parent=c.parentNode, W=Math.max(parent.clientWidth||300,120);
    var attrH=parseFloat(c.getAttribute('height'))||150, H=parent.clientHeight>40?parent.clientHeight:Math.round(W/(300/attrH));
    var dpr=window.devicePixelRatio||1;
    c.style.width=W+'px'; c.style.height=H+'px'; c.width=W*dpr; c.height=H*dpr;
    var g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
    var ds=cfg.data.datasets, labels=cfg.data.labels||[], type=cfg.type;
    if(type==='doughnut'){
      var d=ds[0], tot=d.data.reduce(function(a,b){return a+b;},0)||1, cx=W/2, cy=H/2, R=Math.min(W,H)/2-4;
      var cut=parseFloat(o.cutout||'50')/100, a0=-Math.PI/2;
      d.data.forEach(function(v,i){ var a1=a0+v/tot*Math.PI*2; g.beginPath(); g.arc(cx,cy,R,a0,a1); g.arc(cx,cy,R*cut,a1,a0,true); g.closePath(); g.fillStyle=d.backgroundColor[i]; g.fill(); a0=a1; });
      return;
    }
    var xt=(sc.x&&sc.x.ticks)||{}, yt=(sc.y&&sc.y.ticks)||{}, grid=(sc.y&&sc.y.grid&&sc.y.grid.color)||'#e7ebf1', txt=yt.color||xt.color||'#697386';
    var legendBottom=o.plugins&&o.plugins.legend&&o.plugins.legend.display!==false&&o.plugins.legend.position==='bottom';
    var all=[]; ds.forEach(function(s){all=all.concat(s.data.filter(function(v){return v!=null;}));});
    var ymin=(sc.y&&sc.y.min!=null)?sc.y.min:Math.min(0,Math.min.apply(null,all));
    var ymax=(sc.y&&sc.y.max!=null)?sc.y.max:Math.max.apply(null,all);
    if(!(sc.y&&sc.y.max!=null)){ var step0=Math.pow(10,Math.floor(Math.log10((ymax-ymin)||1))); var n=[1,2,2.5,5,10].map(function(m){return m*step0;}).find(function(s){return (ymax-ymin)/s<=6;})||step0*10; ymax=Math.ceil(ymax/n)*n; this._step=n; } else { this._step=(ymax-ymin)/5; }
    var step=this._step||(ymax-ymin)/5;
    g.font='11px Inter, sans-serif';
    var fmt=yt.callback||function(v){return v;};
    var padL=10, padR=10, padT=10, padB=26+(legendBottom?22:0);
    for(var v=ymin;v<=ymax+1e-9;v+=step){ padL=Math.max(padL,g.measureText(String(fmt(v))).width+16); }
    var pw=W-padL-padR, ph=H-padT-padB;
    var Y=function(v){return padT+ph-(v-ymin)/((ymax-ymin)||1)*ph;};
    g.textAlign='right'; g.textBaseline='middle';
    for(var t=ymin;t<=ymax+1e-9;t+=step){ var y=Y(t); g.strokeStyle=grid; g.lineWidth=1; g.beginPath(); g.moveTo(padL,y); g.lineTo(W-padR,y); g.stroke(); g.fillStyle=txt; g.fillText(String(fmt(Math.round(t*1e6)/1e6)),padL-8,y); }
    var nL=labels.length, slot=pw/nL;
    g.textAlign='center'; g.textBaseline='top'; g.fillStyle=xt.color||txt;
    var skip=Math.ceil(nL/Math.max(1,Math.floor(pw/48)));
    labels.forEach(function(l,i){ if(i%skip===0) g.fillText(l,padL+slot*i+slot/2,padT+ph+8); });
    if(type==='bar'){
      var k=ds.length, bw=Math.min(slot*0.7/k,34);
      ds.forEach(function(s,si){ g.fillStyle=s.backgroundColor; s.data.forEach(function(v,i){ if(v==null) return; var x=padL+slot*i+slot/2-(k*bw)/2+si*bw, y=Y(v), h=Y(Math.max(ymin,0))-y, r=Math.min(5,bw/2,Math.abs(h));
        g.beginPath(); g.moveTo(x,y+h); g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.lineTo(x+bw-r,y); g.quadraticCurveTo(x+bw,y,x+bw,y+r); g.lineTo(x+bw,y+h); g.closePath(); g.fill(); }); });
    } else {
      ds.forEach(function(s){
        var pts=s.data.map(function(v,i){return v==null?null:[padL+slot*i+slot/2,Y(v)];}).filter(Boolean);
        if(!pts.length) return;
        function path(){ g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(var i=1;i<pts.length;i++){ var p=pts[i-1],q=pts[i],mx=(p[0]+q[0])/2; g.bezierCurveTo(mx,p[1],mx,q[1],q[0],q[1]); } }
        if(s.fill){ path(); g.lineTo(pts[pts.length-1][0],padT+ph); g.lineTo(pts[0][0],padT+ph); g.closePath(); g.fillStyle=s.backgroundColor; g.fill(); }
        path(); g.strokeStyle=s.borderColor; g.lineWidth=2; g.stroke();
        if(s.pointRadius){ g.fillStyle=s.borderColor; pts.forEach(function(p){ g.beginPath(); g.arc(p[0],p[1],s.pointRadius,0,7); g.fill(); }); }
      });
    }
    if(legendBottom){ var lx=W/2, ly=H-10; g.textAlign='left'; g.textBaseline='middle';
      var wTot=ds.reduce(function(a,s){return a+g.measureText(s.label||'').width+26;},0); lx=(W-wTot)/2;
      ds.forEach(function(s){ g.fillStyle=s.backgroundColor||s.borderColor; g.fillRect(lx,ly-5,10,10); g.fillStyle=txt; g.fillText(s.label||'',lx+16,ly); lx+=g.measureText(s.label||'').width+26; }); }
  };
  window.Chart=Chart;
})();
}
</script>
<style>
:root{
  --bg:#eef1f7; --surface:#ffffff; --surface-2:#f6f8fb; --text:#1b2333; --text-muted:#697386; --border:#e8ecf2;
  --navy-950:#0a1220; --navy-900:#0e1c33; --navy-800:#17294a; --navy-700:#20365f;
  --blue:#2e5fe8; --blue-600:#2450cc; --blue-50:#eaf0fe;
  --gold:#d7a13c; --gold-600:#b9862a; --gold-50:#fbf1de;
  --green:#189a5a; --green-50:#e6f8ee;
  --red:#e0394a; --red-50:#fdeced;
  --amber:#e0932e; --amber-50:#fdf1e0;
  --slate-500:#8a93a6;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --shadow-md: 0 4px 14px rgba(16,24,40,.08), 0 1px 3px rgba(16,24,40,.05);
  --shadow-lg: 0 16px 36px rgba(16,24,40,.16), 0 4px 12px rgba(16,24,40,.07);
  --ease: cubic-bezier(.2,.7,.2,1);
  --radius: 16px;
  /* Bootstrap 5 variable contract, remapped to the Interior Counsel palette so
     the component set (btn / card / badge / table / modal / offcanvas / nav)
     follows Bootstrap's own design tokens instead of one-off values. */
  --bs-primary: var(--blue); --bs-primary-rgb: 46,95,232;
  --bs-secondary: var(--slate-500); --bs-success: var(--green); --bs-danger: var(--red);
  --bs-warning: var(--amber); --bs-info: var(--gold);
  --bs-body-bg: var(--bg); --bs-body-color: var(--text);
  --bs-border-color: var(--border); --bs-border-radius: var(--radius); --bs-border-radius-sm: 9px; --bs-border-radius-lg: 18px; --bs-border-radius-pill: 999px;
  --bs-box-shadow: var(--shadow); --bs-box-shadow-lg: var(--shadow-lg);
  --bs-font-sans-serif: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
:root{color-scheme:light;}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0a0f1a; --surface:#111a2b; --surface-2:#0e1626; --text:#e8ecf4; --text-muted:#95a0b5; --border:#223049;
  --blue-50:#152343; --gold-50:#2a2113; --green-50:#0f2a1d; --red-50:#2c1417; --amber-50:#2a1e0d;
}
.bi{vertical-align:-.15em;flex-shrink:0;width:16px;height:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 520px at 100% -8%, rgba(46,95,232,.05), transparent 60%),
    radial-gradient(900px 500px at -5% 0%, rgba(215,161,60,.05), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-.005em;
}
h1,h2,h3,h4,.brand-font{font-family:Manrope, Inter, sans-serif; letter-spacing:-.01em;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--slate-500);background-clip:padding-box;}
#page-content{animation:pageIn .28s var(--ease);}
@keyframes pageIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
:focus-visible{outline:2px solid rgba(46,95,232,.45);outline-offset:2px;}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:264px; flex-shrink:0; background:linear-gradient(190deg,var(--navy-900) 0%,var(--navy-950) 78%);
  color:#cfd8ea; display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:40;
  transition:width .2s var(--ease), transform .22s var(--ease); overflow:hidden;
  box-shadow:1px 0 0 rgba(255,255,255,.04) inset, 4px 0 24px rgba(5,9,20,.18);
}
#sidebar.collapsed{width:78px;}
#sidebar .brand{display:flex;align-items:center;gap:11px;padding:21px 18px;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap;}
#sidebar .brand .mark{width:40px;height:40px;flex-shrink:0;border-radius:11px;background:linear-gradient(155deg,var(--gold-50),#f0dcae);display:flex;align-items:center;justify-content:center;color:var(--gold-600);box-shadow:0 3px 10px rgba(215,161,60,.28), inset 0 0 0 1px rgba(215,161,60,.4);}
#sidebar .brand .name{font-family:Manrope,sans-serif;font-weight:800;font-size:17.5px;color:#fff;}
#sidebar .brand .name span{color:var(--gold);}
#sidebar .brand .tag{font-size:11px;color:#8b96b0;margin-top:1px;}
#sidebar.collapsed .brand .name,#sidebar.collapsed .brand .tag{display:none;}
#sidebar nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px;}
#sidebar nav::-webkit-scrollbar{width:5px;}
#sidebar nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);}
.nav-item{position:relative;}
.nav-link{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#a9b4cc;font-size:13.5px;font-weight:500;
  margin-bottom:2px;white-space:nowrap;cursor:pointer;transition:background .16s var(--ease),color .16s var(--ease),padding-left .16s var(--ease);
}
.nav-link svg{width:18px;height:18px;flex-shrink:0;}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff;padding-left:15px;}
.nav-link.active{background:linear-gradient(90deg,rgba(46,95,232,.22),rgba(46,95,232,.03));color:#fff;box-shadow:inset 3px 0 0 var(--gold);font-weight:700;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;box-shadow:0 0 0 3px rgba(224,57,74,.18);}
#sidebar.collapsed .nav-link span.label,#sidebar.collapsed .nav-badge{display:none;}
#sidebar.collapsed .nav-link{justify-content:center;}
.submenu{padding-left:30px;max-height:0;overflow:hidden;transition:max-height .18s ease;}
.submenu.open{max-height:1400px;}
.submenu .nav-link{font-size:12.5px;padding:7px 10px;color:#93a0ba;}
#sidebar.collapsed .submenu{display:none;}
.nav-caret{margin-left:auto;width:14px;height:14px;transition:transform .15s;flex-shrink:0;}
.nav-caret.rot{transform:rotate(90deg);}
#sidebar .foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#697591;white-space:nowrap;}
#sidebar.collapsed .foot{display:none;}

#main-wrap{flex:1;margin-left:264px;min-width:0;transition:margin-left .2s var(--ease);display:flex;flex-direction:column;min-height:100vh;}
#main-wrap.collapsed{margin-left:78px;}

#topbar{
  height:66px;background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;
  padding:0 22px;position:sticky;top:0;z-index:30;
}
#hamburger,#hamburger-mobile{background:none;border:none;color:var(--text-muted);padding:6px;border-radius:8px;display:flex;transition:background .15s ease,color .15s ease;}
#hamburger:hover,#hamburger-mobile:hover{background:var(--surface-2);color:var(--text);}
#hamburger-mobile{display:none;}
.search-box{flex:1;max-width:460px;display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 13px;color:var(--text-muted);transition:border-color .15s ease,box-shadow .15s ease;}
.search-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,95,232,.12);}
.search-box input{border:none;background:none;outline:none;color:var(--text);font-size:13.5px;width:100%;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.icon-btn{position:relative;background:none;border:none;color:var(--text-muted);padding:9px;border-radius:9px;display:flex;transition:background .15s ease,color .15s ease,transform .1s ease;}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}
.icon-btn:active{transform:scale(.93);}
.dot-badge{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 0 0 2px var(--surface);}
.profile-chip{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:99px;cursor:pointer;border:1px solid transparent;transition:background .15s ease,border-color .15s ease;}
.profile-chip:hover{background:var(--surface-2);border-color:var(--border);}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--blue-50);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;overflow:hidden;}
.avatar img,img.avatar-photo{width:100%;height:100%;object-fit:cover;display:block;}
.avatar-photo{border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--surface-2);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--border);}
.profile-chip .who{line-height:1.2;}
.profile-chip .who .n{font-weight:700;font-size:13px;}
.profile-chip .who .r{font-size:11px;color:var(--text-muted);}
.profile-chip > svg{width:15px;height:15px;color:var(--text-muted);flex-shrink:0;}

.dropdown{position:absolute;top:58px;right:22px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);width:340px;max-width:calc(100vw - 24px);z-index:80;display:none;overflow:hidden;animation:ddIn .15s var(--ease);}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.dropdown.open{display:block;}
.dropdown .dd-head{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;}
.dropdown .dd-body{max-height:360px;overflow-y:auto;}
.dd-item{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12.8px;cursor:pointer;transition:background .12s ease;}
.dd-item:hover{background:var(--surface-2);}
.dd-item .t{font-weight:600;margin-bottom:2px;}
.dd-item .m{color:var(--text-muted);font-size:11.5px;}
.dd-foot{padding:10px 16px;text-align:center;font-size:12.5px;color:var(--blue);font-weight:600;cursor:pointer;border-top:1px solid var(--border);}
@media(max-width:400px){.dropdown{right:8px;width:calc(100vw - 16px);}}

#page-content{padding:22px 26px 60px;flex:1;max-width:100%;}
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-muted);margin-bottom:8px;}
.breadcrumb svg{width:13px;height:13px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.page-head h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.015em;}
.page-head .sub{color:var(--text-muted);font-size:12.8px;margin-top:4px;}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--bs-border-radius-sm);font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:background .15s var(--ease),border-color .15s var(--ease),box-shadow .15s var(--ease),transform .1s var(--ease);}
.btn svg{width:15px;height:15px;}
.btn:active{transform:translateY(1px) scale(.99);}
.btn:focus-visible{outline:0;box-shadow:0 0 0 .2rem rgba(var(--bs-primary-rgb),.28);}
.btn-primary{background:linear-gradient(180deg,#3a68ea,var(--blue));color:#fff;box-shadow:0 1px 2px rgba(46,95,232,.3),0 4px 10px rgba(46,95,232,.16);}
.btn-primary:hover{background:var(--blue-600);box-shadow:0 6px 16px rgba(46,95,232,.32);transform:translateY(-1px);}
.btn-gold{background:linear-gradient(180deg,#e2b158,var(--gold));color:#3b2a08;}
.btn-gold:hover{background:var(--gold-600);}
.btn-outline{background:var(--surface);color:var(--text);border-color:var(--border);}
.btn-outline:hover{background:var(--surface-2);border-color:#c9d2e0;}
.btn-ghost{background:none;color:var(--text-muted);}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-danger{background:var(--red-50);color:var(--red);}
.btn-danger:hover{background:#fadde0;}

.grid{display:grid;gap:16px;}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.g-kpi.kpi-3{grid-template-columns:repeat(3,minmax(0,1fr));}
@media(max-width:900px){.g-kpi.kpi-3{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:560px){.g-kpi.kpi-3{grid-template-columns:1fr;}}
.g-2{grid-template-columns:repeat(2,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-12-2{grid-template-columns:2fr 1fr;}
@media(max-width:1100px){.g-12-2{grid-template-columns:1fr;}.g-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:720px){.g-2,.g-3{grid-template-columns:1fr;}}
@media(max-width:560px){#page-content{padding:16px 14px 48px;}.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}.grid{gap:10px;}.page-head h1{font-size:19px;}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .2s var(--ease);}
.card-pad{padding:18px 18px;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
.card-head h3{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:9px;}
.card-head h3 svg{width:16px;height:16px;color:var(--blue);}
.card-body{padding:16px 18px;}

.kpi{padding:18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;}
.kpi:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px);border-color:#d7deea;}
.kpi .row1{display:flex;align-items:center;justify-content:space-between;}
.kpi .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(16,24,40,.03);}
.kpi .ic svg{width:19px;height:19px;}
.kpi .label{font-size:12px;color:var(--text-muted);font-weight:600;}
.kpi .value{font-size:21px;font-weight:800;letter-spacing:-.01em;}
.kpi .delta{font-size:11px;font-weight:700;}
.up{color:var(--green);} .down{color:var(--red);}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding:12px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;}
tbody td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
tbody tr{transition:background .12s ease;}
tbody tr:hover{background:var(--surface-2);}
tbody tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;border-radius:0 0 var(--radius) var(--radius);}
.cell-main{display:flex;align-items:center;gap:10px;}
.cell-main .ph{width:32px;height:32px;border-radius:8px;object-fit:cover;background:var(--surface-2);flex-shrink:0;box-shadow:0 0 0 1px var(--border);}
.cell-main .tt{font-weight:600;}
.cell-main .ss{font-size:11.5px;color:var(--text-muted);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge .d{width:6px;height:6px;border-radius:99px;background:currentColor;}
.badge-green{background:var(--green-50);color:var(--green);}
.badge-red{background:var(--red-50);color:var(--red);}
.badge-amber{background:var(--amber-50);color:var(--amber);}
.badge-blue{background:var(--blue-50);color:var(--blue);}
.badge-gray{background:var(--surface-2);color:var(--text-muted);}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.toolbar .search-box{max-width:280px;flex:1;min-width:180px;}
select,.input{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--text);font-family:inherit;transition:border-color .15s ease,box-shadow .15s ease;}
select:focus,.input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,95,232,.12);}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;}
.field label{font-size:12px;font-weight:600;color:var(--text-muted);}
.field .input,.field select{width:100%;}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:800px){.form-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.form-grid{grid-template-columns:1fr;}}
.section-title{font-size:13px;font-weight:800;margin:22px 0 12px;display:flex;align-items:center;gap:8px;color:var(--navy-900);}
:root[data-theme="dark"] .section-title{color:#fff;}
.section-title svg{width:15px;height:15px;color:var(--blue);}
.section-title:first-child{margin-top:0;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab{padding:11px 15px;font-size:13px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:7px;transition:color .15s ease,border-color .15s ease;}
.tab:hover{color:var(--text);}
.tab svg{width:14px;height:14px;}
.tab.active{color:var(--blue);border-color:var(--blue);}

.profile-head{display:flex;gap:22px;padding:24px;flex-wrap:wrap;align-items:center;}
.profile-head img{width:92px;height:92px;border-radius:16px;object-fit:cover;box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--border),var(--shadow-md);flex-shrink:0;background:var(--surface-2);}
.profile-head .meta{display:flex;gap:28px;flex-wrap:wrap;margin-left:8px;}
.profile-head .meta .m-label{font-size:11.5px;color:var(--text-muted);font-weight:600;}
.profile-head .meta .m-val{font-size:13.5px;font-weight:700;margin-top:2px;}
.profile-head .right{margin-left:auto;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
@media(max-width:700px){
  .profile-head{padding:18px;gap:16px;}
  .profile-head img{width:72px;height:72px;}
  .profile-head .meta{margin-left:0;gap:18px 26px;}
  .profile-head .right{margin-left:0;width:100%;flex-direction:row;align-items:center;justify-content:space-between;}
}

.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 24px;}
@media(max-width:600px){.info-grid{grid-template-columns:1fr;}}
.info-row .l{font-size:11.5px;color:var(--text-muted);font-weight:600;}
.info-row .v{font-size:13.5px;font-weight:600;margin-top:2px;}

.progress{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
.progress > div{height:100%;background:linear-gradient(90deg,var(--blue-600),var(--blue));border-radius:99px;transition:width .3s var(--ease);}

.modal-overlay{position:fixed;inset:0;background:rgba(10,15,26,.6);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:18px;max-width:760px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.32);animation:modalIn .18s var(--ease);}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal.modal-sm{max-width:440px;}
.modal.modal-lg{max-width:960px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-head h3{margin:0;font-size:16px;font-weight:800;}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:16px 22px;border-top:1px solid var(--border);flex-wrap:wrap;}
@media(max-width:480px){.modal-overlay{padding:0;align-items:stretch;}.modal{border-radius:0;max-width:100%;min-height:100vh;animation:none;}}

.toast-wrap{position:fixed;bottom:20px;right:20px;left:20px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none;}
.toast{background:var(--navy-900);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.28);display:flex;align-items:center;gap:9px;min-width:220px;max-width:calc(100vw - 40px);animation:toastin .2s var(--ease);pointer-events:auto;}
.toast svg{width:16px;height:16px;color:var(--green);flex-shrink:0;}
@keyframes toastin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.empty{padding:40px 20px;text-align:center;color:var(--text-muted);}
.empty svg{width:34px;height:34px;margin-bottom:10px;opacity:.5;}

.doc-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.doc-row:last-child{border-bottom:none;}
.doc-ic{width:36px;height:36px;border-radius:10px;background:var(--blue-50);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.doc-ic svg{width:16px;height:16px;}
.doc-info{flex:1;min-width:120px;}
.doc-name{font-weight:700;font-size:13px;}
.doc-meta{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
.doc-actions{display:flex;gap:2px;flex-shrink:0;}
@media(max-width:480px){.doc-row{gap:10px;}.doc-actions{width:100%;justify-content:flex-end;padding-left:48px;}}

.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;}
.legend-row .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.legend-row .n{margin-left:auto;font-weight:700;}

.report-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.report-item{border:1px solid var(--border);border-radius:10px;padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--surface);transition:border-color .15s ease,background .15s ease,transform .15s ease;}
.report-item:hover{border-color:var(--blue);background:var(--blue-50);transform:translateY(-1px);}
.report-item svg{width:16px;height:16px;color:var(--blue);flex-shrink:0;}
.report-item span{font-size:12.8px;font-weight:600;}

.settings-nav{display:flex;flex-direction:column;gap:2px;}
.settings-nav a{padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:background .15s ease,color .15s ease;}
.settings-nav a:hover{background:var(--surface-2);color:var(--text);}
.settings-nav a.active{background:var(--blue-50);color:var(--blue);}

.overlay-mobile{position:fixed;inset:0;background:rgba(8,12,22,.5);backdrop-filter:blur(1px);z-index:39;display:none;}
.overlay-mobile.show{display:block;}

@media(max-width:900px){
  #sidebar{transform:translateX(-100%);width:264px;box-shadow:none;}
  #sidebar.mobile-open{transform:translateX(0);box-shadow:8px 0 32px rgba(0,0,0,.28);}
  #main-wrap{margin-left:0!important;}
  #hamburger{display:none;}
  #hamburger-mobile{display:flex;}
  .search-box{display:none;}
  .profile-chip .who{display:none;}
  .profile-chip{padding:6px;}
  #topbar{padding:0 14px;gap:8px;}
}
@media(max-width:380px){
  .page-head{gap:10px;}
  .head-actions .btn span,.head-actions .btn{font-size:12px;}
  .toolbar select{flex:1 1 auto;min-width:0;}
}

/* ---------- Accounting blocks (uses existing card/table/progress styles) ---------- */
.acc-stack{display:flex;flex-direction:column;gap:16px;min-width:0;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
tfoot td{padding:12px;font-weight:800;background:var(--surface-2);border-top:1px solid var(--border);white-space:nowrap;}
.bank-row{padding:10px 0;border-bottom:1px solid var(--border);}
.bank-row:last-child{border-bottom:none;}
.bank-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.bank-row .top b{font-variant-numeric:tabular-nums;}
.print-invoice{background:#fff;color:#111;padding:30px;border-radius:10px;}
.invoice-top{display:flex;justify-content:space-between;border-bottom:2px solid #16294a;padding-bottom:16px;margin-bottom:16px;}
.invoice-table th{background:#f2f5f9;color:#111;}
.invoice-table td{color:#111;}
html{scrollbar-gutter:stable}
.bl{table-layout:fixed;width:100%;font-size:11.5px}.bl th,.bl td{padding:9px 6px;white-space:normal;word-break:break-word;vertical-align:middle;line-height:1.3}
.bl th{font-size:10px;letter-spacing:.02em}.bl .n{text-align:right;font-variant-numeric:tabular-nums}.bl th.n{text-align:right}

.ib{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface);border-radius:7px;color:var(--text-muted);cursor:pointer;margin:0 1px;padding:0}
.ib svg{width:13px;height:13px}.ib:hover{background:var(--blue-50);color:var(--blue);border-color:var(--blue)}.ib.del:hover{background:var(--red-50);color:var(--red);border-color:var(--red)}
@media(max-width:1500px){.bl .c1{display:none}}@media(max-width:1300px){.bl .c2{display:none}}
.cv{position:relative;width:100%;min-width:0;overflow:hidden}
.cv canvas{display:block}
.card-body,.card,.grid>*{min-width:0}

/* ============ ORGANIZED MENU + LOGO + REPORT LETTERHEAD (added) ============ */
#sidebar .brand{gap:12px;padding:18px 16px;}
#sidebar .brand .brand-logo{width:46px;height:46px;flex-shrink:0;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;padding:5px;box-shadow:0 3px 12px rgba(0,0,0,.28), inset 0 0 0 1px rgba(215,161,60,.45);overflow:hidden;}
#sidebar .brand .brand-logo img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
#sidebar.collapsed .brand{justify-content:center;padding:18px 0;}

.nav-group{margin-top:6px;}
.nav-group+.nav-group{margin-top:14px;}
.nav-group-title{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#6f7c99;padding:6px 14px 7px;white-space:nowrap;display:flex;align-items:center;gap:8px;}

.submenu .nav-link{padding:6px 10px;margin-bottom:1px;}

/* Letterhead (logo header) used on every report / printout */
.ic-letterhead{display:flex;align-items:center;gap:16px;padding:14px 20px;margin:0 0 18px;background:#fff;color:#111;border:1px solid var(--border);border-bottom:3px solid var(--gold);border-radius:12px;box-shadow:var(--shadow);}
.ic-letterhead .ic-lh-logo{height:58px;width:auto;max-width:150px;object-fit:contain;flex-shrink:0;}

.ic-letterhead .ic-lh-rep{text-align:right;line-height:1.35;}
.ic-letterhead .ic-lh-rep b{display:block;font-family:Manrope,Inter,sans-serif;font-size:15px;font-weight:800;color:#16294a;text-transform:uppercase;letter-spacing:.03em;}
.ic-letterhead .ic-lh-rep small{display:block;font-size:11px;color:#5b6577;}
.ic-letterhead.print-only{display:none;}
.modal-body>.ic-letterhead{margin-bottom:16px;box-shadow:none;}
/* logo inside invoice / payslip / PO printouts */
.invoice-top .ic-inv-logo{height:54px;width:auto;max-width:140px;object-fit:contain;display:block;margin-bottom:8px;}
@media(max-width:700px){.ic-letterhead{flex-wrap:wrap;}.ic-letterhead .ic-lh-rep{text-align:left;width:100%;}}

@media print{
  @page{margin:12mm;}
  html,body{background:#fff!important;}
  #sidebar,#topbar,.pgbar-top,.pgbar-bot,.toast-wrap,.overlay-mobile,.head-actions,.breadcrumb,.modal-foot,.modal-head,.toolbar,.tabs,.btn,button{display:none!important;}
  #main-wrap{margin-left:0!important;}
  #page-content{padding:0!important;}
  .ic-letterhead{box-shadow:none;border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .ic-letterhead.print-only{display:flex;}
  .card,.table-wrap{box-shadow:none!important;}
  .table-wrap{overflow:visible!important;}
  /* when a report/invoice modal is open, print only that modal */
  body:has(#modal-overlay.open) #app{display:none!important;}
  #modal-overlay.open{position:static!important;display:block!important;background:none!important;padding:0!important;backdrop-filter:none!important;}
  #modal-overlay .modal{box-shadow:none!important;max-width:none!important;width:100%!important;animation:none!important;background:#fff!important;}
  #modal-overlay .modal-body{max-height:none!important;overflow:visible!important;padding:0!important;}
  tr{page-break-inside:avoid;}
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

function ri(min,max){return Math.floor(rnd()*(max-min+1))+min;}
function pick(arr){return arr[Math.floor(rnd()*arr.length)];}
function pad(n,l){return String(n).padStart(l,'0');}
function money(n){return '৳ ' + Math.round(n).toLocaleString('en-IN');}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){return pad(d.getDate(),2)+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();}

function nameHash(name){let hash=0; for(let i=0;i<(name||'').length;i++){hash=name.charCodeAt(i)+((hash<<5)-hash);} return Math.abs(hash);}
// Real (non-copyrighted, freely-licensed) dummy headshot photos — keyed deterministically
// off each person's name so the same person always renders the same face.
function personPhoto(name,gender){
  const g = gender==='F'||gender==='Female' ? 'women' : 'men';
  const idx = nameHash(name)%100;
  return `https://randomuser.me/api/portraits/${g}/${idx}.jpg`;
}
// For company/contact records where gender isn't tracked explicitly, infer a
// reasonable default from a title prefix (Mr./Ms./Mrs.) and fall back to a
// deterministic split so the mix of faces still looks natural.
function contactPhoto(nameOrCompany, contactName){
  const src = contactName || nameOrCompany;
  let gender = 'men';
  if(/^(Ms\.|Mrs\.|Miss)/i.test(src)) gender='women';
  else if(/^Mr\./i.test(src)) gender='men';
  else gender = nameHash(nameOrCompany)%100 < 34 ? 'women' : 'men';
  const idx = nameHash(nameOrCompany)%100;
  return `https://randomuser.me/api/portraits/${gender}/${idx}.jpg`;
}

function doGlobalSearch(q){
  const box=document.getElementById('dd-notif');
  if(!q||q.length<2){return;}
  q=q.toLowerCase();
  const results=[];
  EMPLOYEES.filter(e=>e.name.toLowerCase().includes(q)||e.id.toLowerCase().includes(q)||e.dept.toLowerCase().includes(q)).slice(0,4).forEach(e=>results.push({cat:'Employee',label:e.name+' · '+e.id,action:`nav-emp-profile|${e.id}`}));
  CUSTOMERS.filter(c=>c.name.toLowerCase().includes(q)).slice(0,4).forEach(c=>results.push({cat:'Customer',label:c.name,action:`nav|customers`}));
  PRODUCTS.filter(p=>p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)).slice(0,4).forEach(p=>results.push({cat:'Product',label:p.name+' · '+p.sku,action:'nav|inventory'}));
  PROJECTS.filter(p=>p.name.toLowerCase().includes(q)).slice(0,4).forEach(p=>results.push({cat:'Project',label:p.name,action:'nav|projects'}));
  INVOICES.filter(i=>i.no.toLowerCase().includes(q)||i.customer.toLowerCase().includes(q)).slice(0,4).forEach(i=>results.push({cat:'Invoice',label:i.no+' · '+i.customer,action:'nav|sales'}));
  let html = `<div class="dd-head">Search results <span style="font-size:11px;color:var(--text-muted);font-weight:500;">${results.length} found</span></div><div class="dd-body">`;
  if(results.length===0){html+=`<div class="dd-item">No matches for "${q}"</div>`;}

let chartRefs={};
/* Standalone pie renderer (works even when Chart.js CDN is blocked) */
function drawPie(cv,c,fm){
  const sl=c.slices, par=cv.parentElement; par.style.position='relative';
  cv.style.position='absolute'; cv.style.left='0'; cv.style.top='0';
  const tip=document.createElement('div');
  tip.style.cssText='position:absolute;pointer-events:none;display:none;z-index:5;background:rgba(20,28,45,.94);color:#fff;padding:8px 11px;border-radius:8px;font-size:12px;line-height:1.5;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25);';
  par.appendChild(tip);
  let hover=-1, geo=null;
  const TAU=Math.PI*2; const amt=v=>Number(v).toLocaleString('en-US',{maximumFractionDigits:0})+' ৳';
  function draw(){
    const dpr=window.devicePixelRatio||1, W=par.clientWidth, H=par.clientHeight; if(!W||!H) return;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.width=W+'px'; cv.style.height=H+'px';
    const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const txt=getComputedStyle(document.body).color, cx=W/2, cy=H/2, R=Math.max(40,Math.min(W/2-160,H/2-36));
    let a0=-Math.PI/2; const segs=sl.map(q=>{const ang=q.v/c.total*TAU; const o={a0:a0,a1:a0+ang,ang:ang,mid:a0+ang/2}; a0+=ang; return o;});
    geo={cx:cx,cy:cy,R:R,segs:segs,W:W,H:H};
    const single=sl.length===1;
    segs.forEach((g,k)=>{
      const off=k===hover?8:0; g.x=cx+Math.cos(g.mid)*off; g.y=cy+Math.sin(g.mid)*off;
      ctx.beginPath(); if(single){ctx.arc(cx,cy,R,0,TAU);} else {ctx.moveTo(g.x,g.y); ctx.arc(g.x,g.y,R,g.a0,g.a1); ctx.closePath();}
      ctx.fillStyle=sl[k].c; ctx.fill();
    });
    ctx.textBaseline='middle'; const outs=[];
    segs.forEach((g,k)=>{
      const pv=sl[k].v/c.total*100, pct=(pv<1?'<1':Math.round(pv))+'%', name=sl[k].label;
      if(g.ang<0.35){outs.push({g:g,k:k,pct:pct,name:name,amt:amt(sl[k].v)});return;}
      if(g.ang<0.95){ctx.font='600 13px sans-serif'; if(ctx.measureText(name).width>R*0.8){outs.push({g:g,k:k,pct:pct,name:name,amt:amt(sl[k].v)});return;}}  /* name does not fit inside: label outside */
      ctx.fillStyle='#fff'; ctx.textAlign='center';
      const r=single?0:R*(g.ang>=0.95?0.6:0.66), x=g.x+Math.cos(g.mid)*r, y=g.y+Math.sin(g.mid)*r;
      if(g.ang>=0.95){                                   /* wide slice: horizontal, name then % */
        ctx.font='600 14px sans-serif'; const maxW=Math.max(60,R*0.75); const lines=[]; let cur='';
        name.split(' ').forEach(w=>{const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}); if(cur)lines.push(cur);
        const lh=17, y0=y-((lines.length+2)*lh)/2+lh/2;
        lines.forEach((ln,j)=>ctx.fillText(ln,x,y0+j*lh)); ctx.font='700 14px sans-serif'; ctx.fillText(amt(sl[k].v),x,y0+lines.length*lh); ctx.font='600 13px sans-serif'; ctx.fillText(pct,x,y0+(lines.length+1)*lh);
      } else {                                           /* medium slice: rotated along the slice */
        ctx.save(); ctx.translate(x,y); let rot=g.mid; if(Math.cos(g.mid)<0) rot+=Math.PI; ctx.rotate(rot);
        ctx.font='600 13px sans-serif';
        const sub=amt(sl[k].v)+' · '+pct; if(ctx.measureText(name).width<=R*0.8){ctx.fillText(name,0,-8); ctx.font='700 12px sans-serif'; ctx.fillText(sub,0,8);} else {ctx.font='700 12px sans-serif'; ctx.fillText(ctx.measureText(sub).width<=R*0.8?sub:pct,0,0);}
        ctx.restore();
      }
    });
    [1,-1].forEach(side=>{                               /* thin slices: label outside with a leader line */
      const grp=outs.filter(o=>(Math.cos(o.g.mid)>=0?1:-1)===side).sort((a,b)=>Math.sin(a.g.mid)-Math.sin(b.g.mid));
      let lastY=-1e9;
      grp.forEach(o=>{
        let ty=o.g.y+Math.sin(o.g.mid)*(R+22); if(ty-lastY<17) ty=lastY+17; lastY=ty;
        const sx=o.g.x+Math.cos(o.g.mid)*R, sy=o.g.y+Math.sin(o.g.mid)*R, ex=o.g.x+Math.cos(o.g.mid)*(R+14), ey=o.g.y+Math.sin(o.g.mid)*(R+14), tx=ex+side*14;
        ctx.strokeStyle=sl[o.k].c; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.lineTo(tx,ty); ctx.stroke();
        ctx.fillStyle=txt; ctx.textAlign=side>0?'left':'right'; ctx.font='600 11.5px sans-serif';
        const tail='  '+o.amt+' · '+o.pct; let nm=o.name; while(nm.length>8&&ctx.measureText(nm+tail).width>(W/2-R-50)) nm=nm.slice(0,-2);
        if(nm!==o.name) nm=nm.trimEnd()+'…';
        ctx.fillText(nm+tail,tx+side*5,ty);
      });
    });
    if(!single){ctx.beginPath(); ctx.arc(cx,cy,6,0,TAU); ctx.fillStyle='#f08a8a'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#274a5a'; ctx.stroke();}  /* centre dot */
  }
  function idxAt(mx,my){
    if(!geo) return -1; const dx=mx-geo.cx, dy=my-geo.cy; if(Math.hypot(dx,dy)>geo.R+8) return -1;
    if(sl.length===1) return 0;
    let a=Math.atan2(dy,dx); if(a<-Math.PI/2) a+=TAU;
    for(let k=0;k<geo.segs.length;k++){ if(a>=geo.segs[k].a0&&a<geo.segs[k].a1) return k; }
    return -1;
  }
  function show(k,x,y){
    const q=sl[k]; tip.innerHTML='<b>'+q.label+'</b><br>'+fm(q.v)+' &nbsp;·&nbsp; '+(q.v/c.total*100).toFixed(1)+'%';
    tip.style.display='block'; let L=x+14, T=y+14; if(L+tip.offsetWidth>geo.W) L=x-14-tip.offsetWidth; if(T+tip.offsetHeight>geo.H) T=y-14-tip.offsetHeight;
    tip.style.left=Math.max(0,L)+'px'; tip.style.top=Math.max(0,T)+'px';
  }
  cv.addEventListener('mousemove',e=>{
    const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top, k=idxAt(x,y);
    if(k!==hover){hover=k; draw();}
    if(k>=0) show(k,x,y); else tip.style.display='none';
    cv.style.cursor=k>=0?'pointer':'default';
  });
  cv.addEventListener('mouseleave',()=>{hover=-1; tip.style.display='none'; draw();});
  let ro=null; if(window.ResizeObserver){ro=new ResizeObserver(()=>draw()); ro.observe(par);} else window.addEventListener('resize',draw);
  draw(); requestAnimationFrame(draw);
  return {
    destroy(){ if(ro) ro.disconnect(); else window.removeEventListener('resize',draw); tip.remove(); },
    setHover(k){ hover=k; draw(); if(k>=0&&geo){const g=geo.segs[k]; show(k,geo.cx+Math.cos(g.mid)*geo.R*0.6,geo.cy+Math.sin(g.mid)*geo.R*0.6);} else tip.style.display='none'; }
  };
}

function renderEmployees(){

    if(f.q && !(e.name.toLowerCase().includes(f.q)||e.id.toLowerCase().includes(f.q)||e.mobile.includes(f.q)||e.dept.toLowerCase().includes(f.q))) return false;
    if(f.dept && e.dept!==f.dept) return false;
    if(f.status && e.status!==f.status) return false;
    return true;
  });
  document.getElementById('page-content').innerHTML=`
  ${crumbs(['Employees'])}
  ${pageHead('Employees','Manage your workforce — '+EMPLOYEES.length+' employees on record',`
    <button class="btn btn-outline btn-sm">${ic('upload')} Import</button>
    <button class="btn btn-outline btn-sm">${ic('download')} Export</button>
    <button class="btn btn-outline btn-sm">${ic('print')} Print</button>

    <div class="card-body">
      <div class="toolbar">
        <div class="search-box"><span style="display:flex">${ic('search')}</span><input id="emp-search" placeholder="Search name, ID, mobile, department" value="${f.q||''}"></div>
        <select id="f-dept"><option value="">All Departments</option>${DEPTS.map(d=>`<option ${f.dept===d?'selected':''}>${d}</option>`).join('')}</select>
        <select id="f-status"><option value="">All Status</option>${['Active','On Leave','Inactive'].map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select>
        <button class="btn btn-outline btn-sm">${ic('filter')} More Filters</button>
      </div>
      <div class="table-wrap"><table><thead><tr>
        <th></th><th>Employee ID</th><th>Name</th><th>Designation</th><th>Department</th><th>Mobile</th><th>Joining Date</th><th>Current Salary</th><th>Status</th><th>Actions</th>
      </tr></thead><tbody>
      ${list.map(e=>`<tr>
        <td><img class="cell-main ph" src="${e.photo}" style="width:32px;height:32px;border-radius:8px;"></td>
        <td><b>${e.id}</b></td>
        <td class="tt" style="cursor:pointer;color:var(--blue);font-weight:700;" data-action="nav-emp-profile" data-id="${e.id}">${e.name}</td>
        <td>${e.desig}</td><td>${e.dept}</td><td>${e.mobile}</td><td>${e.join}</td><td>${money(e.salary)}</td>
        <td>${statusBadge(e.status)}</td>
        <td><button class="btn btn-ghost btn-sm" data-action="nav-emp-profile" data-id="${e.id}" title="View">${ic('eye')}</button>
        <button class="btn btn-ghost btn-sm" data-action="open-employee-form" data-id="${e.id}" title="Edit">${ic('edit')}</button>
        <button class="btn btn-ghost btn-sm" data-action="delete-confirm" data-name="${e.name}" title="Delete">${ic('trash')}</button></td>
      </tr>`).join('') || `<tr><td colspan="10" class="empty">No employees match these filters</td></tr>`}
      </tbody></table></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px;color:var(--text-muted);">
        <span>Showing ${list.length} of ${EMPLOYEES.length} employees</span>
        <div style="display:flex;gap:6px;"><button class="btn btn-outline btn-sm">Prev</button><button class="btn btn-primary btn-sm">1</button><button class="btn btn-outline btn-sm">Next</button></div>
      </div>
    </div>
  </div>`;
  document.getElementById('emp-search').addEventListener('input',e=>{state.empFilter.q=e.target.value.toLowerCase();renderEmployees();document.getElementById('emp-search').focus();document.getElementById('emp-search').setSelectionRange(999,999);});

}

function kpiSmall(label,value,icon,color){

function projIso(str){const t=Date.parse(str);if(isNaN(t))return '';const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function projFromIso(v){return v?fmtDate(new Date(v+'T00:00:00')):'';}
function projForm(p){
  const isNew=!p,P=p||{name:'',customer:'',type:PROJ_TYPES[0],manager:'',designer:'',loc:WORK_LOCATIONS[0],budget:'',status:'Planning',progress:0,priority:'Medium',start:'',expected:''};
  const e=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const opts=(arr,cur)=>arr.map(o=>`<option ${o===cur?'selected':''}>${e(o)}</option>`).join('');
  const mg=[...new Set(EMPLOYEES.filter(x=>x.dept==='Project Management').map(x=>x.name).concat(P.manager?[P.manager]:[]))],dg=[...new Set(EMPLOYEES.filter(x=>x.dept==='Design').map(x=>x.name).concat(P.designer?[P.designer]:[]))];
  const L=(l,h)=>`<label style="font-size:13px;font-weight:500">${l}</label>${h}`;
  openModal(`<div class="modal-head"><h3>${isNew?'New Project':'Edit Project — '+e(P.id)}</h3><button class="btn btn-ghost btn-sm" data-action="close-modal">${ic('x')}</button></div><div class="modal-body">
  <div style="display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px 14px;align-items:center">
   ${L('Project Name *',`<input class="input" id="pj-name" value="${e(P.name)}" placeholder="e.g. Gulshan Residence Interior">`)}
   ${L('Customer *',`<input class="input" id="pj-cu" list="pj-cu-l" autocomplete="off" value="${e(P.customer)}" placeholder="Select or type customer"><datalist id="pj-cu-l">${CUSTOMERS.map(c=>`<option value="${e(c.name)}">`).join('')}</datalist>`)}
   ${L('Project Type',`<select class="input" id="pj-type">${opts(PROJ_TYPES,P.type)}</select>`)}
   ${L('Project Manager',`<select class="input" id="pj-mg"><option value="">Select…</option>${opts(mg,P.manager)}</select>`)}
   ${L('Designer',`<select class="input" id="pj-dg"><option value="">Select…</option>${opts(dg,P.designer)}</select>`)}
   ${L('Location',`<select class="input" id="pj-loc">${opts(WORK_LOCATIONS,P.loc)}</select>`)}
   ${L('Project Amount (Budget) *',`<input class="input" id="pj-bud" type="number" min="0" value="${e(P.budget)}" placeholder="0">`)}
   ${L('Status',`<select class="input" id="pj-st">${opts(PROJ_STATUS,P.status)}</select>`)}
   ${L('Priority',`<select class="input" id="pj-pr">${opts(['High','Medium','Low'],P.priority)}</select>`)}
   ${L('Progress %',`<input class="input" id="pj-prog" type="number" min="0" max="100" value="${e(P.progress)}">`)}
   ${L('Start Date',`<input class="input" id="pj-s" type="date" value="${projIso(P.start)}">`)}
   ${L('Expected Completion',`<input class="input" id="pj-x" type="date" value="${projIso(P.expected)}">`)}
  </div></div>
  <div class="modal-foot"><button class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="proj-save" data-id="${isNew?'':e(P.id)}">${ic('check')} ${isNew?'Create Project':'Save Changes'}</button></div>`);
}
const projRefresh=()=>{if(state.page==='project-profile'){const id=state.params&&state.params.id;if(PROJECTS.some(x=>x.id===id))renderProjectProfile();else nav('projects');}else renderProjects();};
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;
  if(a==='proj-new')projForm(null);
  else if(a==='proj-edit')projForm(PROJECTS.find(x=>x.id===t.dataset.id));
  else if(a==='proj-del'){const p=PROJECTS.find(x=>x.id===t.dataset.id);if(!p)return;openModal(`<div class="modal-head"><h3>Delete Project</h3><button class="btn btn-ghost btn-sm" data-action="close-modal">${ic('x')}</button></div><div class="modal-body">Are you sure you want to delete project <b>${p.id} — ${p.name}</b>? This action cannot be undone.</div><div class="modal-foot"><button class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="proj-del-yes" data-id="${p.id}">${ic('trash')} Delete</button></div>`,'modal-sm');}
  else if(a==='proj-del-yes'){const i=PROJECTS.findIndex(x=>x.id===t.dataset.id);if(i>-1){const n=PROJECTS[i].name;PROJECTS.splice(i,1);closeModal();toast('Project “'+n+'” deleted');if(state.page==='project-profile')nav('projects');else renderProjects();}}
  else if(a==='proj-save'){
    const g=id=>document.getElementById(id).value.trim(),id=t.dataset.id,name=g('pj-name'),cu=g('pj-cu'),bud=parseFloat(g('pj-bud'));
    if(!name){toast('Project name is required');return;}
    if(!cu){toast('Customer is required');return;}
    if(!(bud>=0)||g('pj-bud')===''){toast('Enter the project amount');return;}
    const prog=Math.max(0,Math.min(100,parseInt(g('pj-prog'))||0));
    const data={name,customer:cu,type:g('pj-type'),manager:g('pj-mg'),designer:g('pj-dg'),loc:g('pj-loc'),budget:bud,status:g('pj-st'),priority:g('pj-pr'),progress:prog,start:projFromIso(g('pj-s')),expected:projFromIso(g('pj-x'))};
    if(id){const p=PROJECTS.find(x=>x.id===id);Object.assign(p,data);toast('Project updated');}
    else{const n=Math.max(0,...PROJECTS.map(x=>parseInt(String(x.id).replace(/\D/g,''))||0))+1;
      PROJECTS.unshift(Object.assign({id:'IC-P-'+String(n).padStart(3,'0'),actualCost:0,received:0},data));toast('Project created');}
    closeModal();projRefresh();
  }
});

const pjIso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pjDt=v=>v?projFromIso(v):'—';

const pjCy=(t,i,s)=>`<span data-action="pj-cyc" data-tab="${t}" data-i="${i}" style="cursor:pointer" title="Click to change status">${statusBadge(s)}</span>`;

function pjData(p){
  if(PJD[p.id])return PJD[p.id];
  const h=nameHash(p.id),s=Date.parse(p.start)||+TODAY,x=Date.parse(p.expected)||s+2e10,st=pjStaff(),pr=p.progress/100;
  const at=f=>pjIso(new Date(s+(x-s)*f)),sts=f=>pr>=f?'Completed':pr>=f-.2?'In Progress':'Pending',who=i=>st[(h+i*3)%st.length];
  return PJD[p.id]={
    tl:[['Design Approval',.1],['Material Procurement',.3],['Site Work Start',.5],['Finishing & Fit-out',.8],['Handover',1]].map(([name,f])=>({name,date:at(f),status:sts(f),note:''})),
    tasks:['Finalize design & BOQ','Place material orders','Site measurement & marking','Ceiling & partition work'].map((name,i)=>({name,who:who(i),pri:['High','Medium','Medium','Low'][i],due:at(.15+.2*i),status:sts(.15+.2*i)})),
    mats:[0,1,2].map(i=>{const m=PRODUCTS[(h+i*7)%PRODUCTS.length];return{product:m.name,unit:m.unit,qty:10+(h%15)*(i+1),rate:m.sell,status:['Received','Approved','Pending'][i]};}),
    po:[0,1].map(i=>{const o=PURCHASES[(h+i*5)%PURCHASES.length];return{ref:o.no,supplier:o.supplier,date:pjIso(new Date(Date.parse(o.date)||+TODAY)),amount:o.total,status:o.status};}),
    exp:[['Labor','Site labor — first fortnight',.06],['Transport','Material transport & unloading',.02],['Site Overhead','Electricity, tools & consumables',.015]].map(([category,desc,f],i)=>({date:at(.2+.15*i),category,desc,amount:Math.round(p.actualCost*f/500)*500,paid:['Cash','Bank','bKash'][i]})),
    team:[{member:p.manager,role:'Project Manager'},{member:p.designer,role:'Lead Designer'},{member:who(1),role:'Site Supervisor'}],
    docs:[],
    comm:[{type:'Meeting',date:at(.02),by:p.manager,summary:'Kick-off meeting — scope, budget and timeline confirmed with client.',follow:''},{type:'Call',date:at(.12),by:p.designer,summary:'Client approved the final design concept and material samples.',follow:at(.2)}]
  };
}

function pjForm(p,t,i){

    else h=`<input class="input" id="pf-${k}" type="${ty==='n'?'number':ty==='d'?'date':ty==='f'?'file':'text'}" ${ty==='n'?'min="0"':''} ${ty==='f'?'':`value="${pjE(v)}"`}>`;

const qtRow=()=>`<tr><td><input class="input qt-d" list="qt-pl" style="width:100%;min-width:180px" placeholder="Select product or type a description"></td><td><input class="input qt-q" type="number" min="0" value="1" style="width:76px"></td><td><input class="input qt-u" value="Piece" style="width:84px"></td><td><input class="input qt-r" type="number" min="0" value="0" style="width:110px"></td><td class="qt-a" style="text-align:right;white-space:nowrap">${money(0)}</td><td><button class="btn btn-ghost btn-sm" data-action="qt-delrow" style="color:var(--red)">${ic('x')}</button></td></tr>`;
function qtCalc(){
  let s=0;document.querySelectorAll('#qt-body tr').forEach(r=>{const a=(parseFloat(r.querySelector('.qt-q').value)||0)*(parseFloat(r.querySelector('.qt-r').value)||0);s+=a;r.querySelector('.qt-a').textContent=money(a);});

  <div class="table-wrap"><table><thead><tr><th>Item / Description</th><th>Qty</th><th>Unit</th><th>Rate (৳)</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody id="qt-body">${qtRow()}${qtRow()}</tbody></table></div>
  <button class="btn btn-outline btn-sm" style="margin-top:10px" data-action="qt-addrow">${ic('plus')} Add Item</button>
  <div style="display:flex;justify-content:flex-end;margin-top:14px"><div style="min-width:260px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;font-size:13px">
   <span>Subtotal</span><b id="qt-subt">${money(0)}</b>
   <span>Discount (৳)</span><input class="input" id="qt-disc" type="number" min="0" value="0" style="width:110px;text-align:right">
   <span>VAT (%)</span><input class="input" id="qt-vat" type="number" min="0" value="0" style="width:110px;text-align:right">
   <span>VAT Amount</span><b id="qt-vatt">${money(0)}</b>
   <span style="font-size:15px;font-weight:800">Grand Total</span><b id="qt-grand" style="font-size:15px;color:var(--blue)">${money(0)}</b></div></div>
  <div class="section-title">Terms &amp; Conditions</div>
  <textarea class="input" id="qt-terms" rows="3" style="width:100%">Payment: 50% advance, 40% on material delivery, 10% on handover.
This quotation is valid for 15 days from the date of issue.
Any work outside the listed items will be quoted separately.</textarea></div>
  <div class="modal-foot"><button class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-outline" data-action="qt-save" data-st="Draft" data-id="${p.id}">Save as Draft</button><button class="btn btn-primary" data-action="qt-save" data-st="Sent" data-id="${p.id}">${ic('check')} Save &amp; Mark Sent</button></div>`,'modal-lg');
}
function pjQView(no){
  const q=PJQ.find(x=>x.no===no);if(!q)return;const t=pjQT(q),B=(st,l,c)=>`<button class="btn ${c||'btn-outline'}" data-action="qt-st" data-no="${no}" data-st="${st}">${l}</button>`;
  openModal(`<div class="modal-head"><h3>Quotation ${q.no} ${pjQB(q.st)}</h3><button class="btn btn-ghost btn-sm" data-action="close-modal">${ic('x')}</button></div><div class="modal-body">
  <div class="ic-letterhead"><img class="ic-lh-logo" src="${PJ_LOGO}" alt="" onerror="this.style.display='none'"><div class="ic-lh-co"><b>Interior <span>Counsel</span></b><small>Smart Interior Solutions · Mohakhali, Dhaka, Bangladesh</small></div><div class="ic-lh-rep"><b>Quotation</b><small>${q.no}</small></div></div>
  <div class="info-grid" style="margin-bottom:14px">${infoRow('Customer',pjE(q.cu))}${infoRow('Project',pjE(q.pn))}${infoRow('Date',pjDt(q.date))}${infoRow('Valid Until',pjDt(q.valid))}</div>
  <div style="font-weight:700;margin-bottom:8px">${pjE(q.sub)}</div>
  <div class="table-wrap"><table><thead><tr><th>#</th><th>Description</th><th>Qty</th><th>Unit</th><th>Rate</th><th style="text-align:right">Amount</th></tr></thead><tbody>${q.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${pjE(l.d)}</td><td>${l.q}</td><td>${pjE(l.u)}</td><td>${money(l.r)}</td><td style="text-align:right">${money(l.q*l.r)}</td></tr>`).join('')}</tbody></table></div>
  <div style="display:flex;justify-content:flex-end;margin-top:12px"><div style="min-width:240px;font-size:13px;line-height:2"><div style="display:flex;justify-content:space-between"><span>Subtotal</span><span>${money(t.s)}</span></div><div style="display:flex;justify-content:space-between"><span>Discount</span><span>− ${money(q.disc)}</span></div><div style="display:flex;justify-content:space-between"><span>VAT (${q.vat}%)</span><span>${money(t.v)}</span></div><div style="display:flex;justify-content:space-between;font-size:15px;font-weight:800;border-top:1px solid var(--border);padding-top:4px"><span>Grand Total</span><span>${money(t.g)}</span></div></div></div>

function pjOverview(p){return `
  <div class="grid g-2" style="margin-top:16px;">
    <div class="card"><div class="card-head"><h3>${ic('folder')} Project Details</h3></div><div class="card-body info-grid">
      ${infoRow('Project ID',p.id)}${infoRow('Project Type',p.type)}
      ${infoRow('Start Date',p.start)}${infoRow('Expected Completion',p.expected)}
      ${infoRow('Budget',money(p.budget))}${infoRow('Actual Cost',money(p.actualCost))}
      ${infoRow('Total Received',money(p.received||0))}${infoRow('Project Due',money(Math.max(0,p.budget-(p.received||0))))}
      ${infoRow('Priority',p.priority)}${infoRow('Status',p.status)}
    </div></div>
    <div class="card"><div class="card-head"><h3>${ic('dollar')} Profitability</h3></div><div class="card-body">
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);"><span>Sales Revenue</span><b>${money(Math.round(p.budget*1.08))}</b></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);"><span>Material Cost</span><b>${money(Math.round(p.actualCost*0.75))}</b></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);"><span>Labor &amp; Other Expense</span><b>${money(Math.round(p.actualCost*0.25))}</b></div>
      <div style="display:flex;justify-content:space-between;padding:10px 0 0;font-size:14.5px;"><span><b>Estimated Profit</b></span><b style="color:var(--green)">${money(Math.round(p.budget*1.08)-p.actualCost)}</b></div>
    </div></div>
  </div>`;}

document.addEventListener('input',e=>{const t=e.target,inQ=t.closest&&(t.closest('#qt-body')||/^qt-(disc|vat)$/.test(t.id));if(!inQ)return;
  if(t.classList.contains('qt-d')){const m=PRODUCTS.find(x=>x.name===t.value);if(m){const r=t.closest('tr');r.querySelector('.qt-u').value=m.unit;r.querySelector('.qt-r').value=m.sell;}}
  qtCalc();});
document.addEventListener('change',e=>{if(e.target.id==='pf-product'){const m=PRODUCTS.find(x=>x.name===e.target.value);if(m)document.getElementById('pf-rate').value=m.sell;}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action,d=t.dataset;
  if(a==='pj-tab'){state.params.ptab=d.tab;renderProjectProfile();}
  else if(a==='pj-add'){pjForm(curP(),d.tab,+d.i);}
  else if(a==='pj-cyc'){const r=pjData(curP())[SP[d.tab].k][+d.i];r.status=PJ_ST[(PJ_ST.indexOf(r.status)+1)%PJ_ST.length];renderProjectProfile();}
  else if(a==='pj-del'){openModal(`<div class="modal-head"><h3>Delete ${SP[d.tab].one}</h3><button class="btn btn-ghost btn-sm" data-action="close-modal">${ic('x')}</button></div><div class="modal-body">Are you sure you want to delete this ${SP[d.tab].one.toLowerCase()}? This cannot be undone.</div><div class="modal-foot"><button class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="pj-del-yes" data-tab="${d.tab}" data-i="${d.i}">${ic('trash')} Delete</button></div>`,'modal-sm');}
  else if(a==='pj-del-yes'){pjData(curP())[SP[d.tab].k].splice(+d.i,1);closeModal();toast(SP[d.tab].one+' deleted');renderProjectProfile();}
  else if(a==='pj-save'){
    const p=PROJECTS.find(x=>x.id===d.id),sp=SP[d.tab],rows=pjData(p)[sp.k],i=+d.i,o={};
    for(const [k,l,ty] of sp.f){const el=document.getElementById('pf-'+k);o[k]=ty==='f'?(el.files[0]||null):ty==='n'?(parseFloat(el.value)||0):el.value.trim();}
    const f0=sp.f[0];if(!o[f0[0]]){toast(f0[1].replace(' *','')+' is required');return;}
    if(sp.post)sp.post(o,p,rows,i);
    if(i>=0)Object.assign(rows[i],o);else rows.push(o);
    closeModal();toast(sp.one+(i>=0?' updated':' added'));renderProjectProfile();
  }
  else if(a==='qt-new'){pjQuote(PROJECTS.find(x=>x.id===d.id)||curP());}
  else if(a==='qt-addrow'){document.getElementById('qt-body').insertAdjacentHTML('beforeend',qtRow());}
  else if(a==='qt-delrow'){const b=document.getElementById('qt-body');if(b.rows.length>1){t.closest('tr').remove();qtCalc();}else toast('At least one item row is needed');}
  else if(a==='qt-save'){
    const p=PROJECTS.find(x=>x.id===d.id),g=id=>document.getElementById(id).value.trim();
    const lines=[...document.querySelectorAll('#qt-body tr')].map(r=>({d:r.querySelector('.qt-d').value.trim(),u:r.querySelector('.qt-u').value.trim(),q:parseFloat(r.querySelector('.qt-q').value)||0,r:parseFloat(r.querySelector('.qt-r').value)||0})).filter(l=>l.d&&l.q>0);
    if(!g('qt-cu')){toast('Customer is required');return;}
    if(!g('qt-no')||PJQ.some(x=>x.no===g('qt-no'))){toast('Enter a unique quotation number');return;}
    if(!lines.length){toast('Add at least one item with a quantity');return;}
    PJQ.unshift({no:g('qt-no'),pid:p.id,pn:p.name,cu:g('qt-cu'),date:g('qt-dt'),valid:g('qt-vu'),sub:g('qt-sub'),lines,disc:parseFloat(g('qt-disc'))||0,vat:parseFloat(g('qt-vat'))||0,terms:document.getElementById('qt-terms').value.trim(),st:d.st});
    if(p.status==='Planning')p.status='Quotation';
    closeModal();toast('Quotation '+g('qt-no')+(d.st==='Sent'?' saved & marked sent':' saved as draft'));
    if(state.page==='project-profile'){state.params.ptab='Sales';renderProjectProfile();}
  }
  else if(a==='qt-view'){pjQView(d.no);}
  else if(a==='qt-print'){window.print();}
  else if(a==='qt-del'){const i=PJQ.findIndex(x=>x.no===d.no);if(i>-1&&PJQ[i].st==='Draft'){PJQ.splice(i,1);toast('Draft deleted');renderProjectProfile();}}
  else if(a==='qt-st'){
    const q=PJQ.find(x=>x.no===d.no);if(!q)return;const p=PROJECTS.find(x=>x.id===q.pid);
    if(d.st==='Invoice'){const n='INV-2026-'+String(INVOICES.length+1).padStart(4,'0'),g=pjQT(q).g;
      INVOICES.unshift({no:n,customer:q.cu,project:q.pn,date:fmtDate(TODAY),due:fmtDate(addDays(TODAY,15)),total:g,paid:0,dueAmt:g,payStatus:'Unpaid',status:'Confirmed'});
      q.st='Converted';q.inv=n;toast('Invoice '+n+' created');}
    else{q.st=d.st;
      if(d.st==='Approved'&&p){p.budget=pjQT(q).g;if(['Planning','Quotation'].includes(p.status))p.status='Approved';}
      if(d.st==='Sent'&&p&&p.status==='Planning')p.status='Quotation';
      toast('Quotation '+d.st.toLowerCase());}
    closeModal();if(state.page==='project-profile')renderProjectProfile();
  }
});

/* ---------- SUPPLIERS: add / edit / delete / search ---------- */
const SUP_TERMS=["Net 15","Net 30","Net 45","Advance 50%","LC at Sight","Cash on Delivery"];
function supForm(s){
  const isNew=!s,S=s||{name:'',contact:'',mobile:'',email:'',country:'Bangladesh',paymentTerms:'Net 30',status:'Active'};
  const o=(arr,cur)=>[...new Set([cur].concat(arr))].filter(Boolean).map(x=>`<option ${x===cur?'selected':''}>${pjE(x)}</option>`).join('');
  const L=(l,h)=>`<label style="font-size:13px;font-weight:500">${l}</label>${h}`;
  openModal(`<div class="modal-head"><h3>${isNew?'Add Supplier':'Edit Supplier — '+pjE(S.id)}</h3><button class="btn btn-ghost btn-sm" data-action="close-modal">${ic('x')}</button></div><div class="modal-body">
  <div style="display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px 14px;align-items:center">
   ${L('Supplier Name *',`<input class="input" id="sp-name" value="${pjE(S.name)}" placeholder="e.g. Orient Traders">`)}
   ${L('Contact Person',`<input class="input" id="sp-ct" value="${pjE(S.contact)}">`)}
   ${L('Mobile',`<input class="input" id="sp-mob" value="${pjE(S.mobile)}" placeholder="01XXXXXXXXX">`)}
   ${L('Email',`<input class="input" id="sp-em" type="email" value="${pjE(S.email)}">`)}
   ${L('Country',`<input class="input" id="sp-co" list="sp-col" value="${pjE(S.country)}"><datalist id="sp-col">${['Bangladesh','India','China','Malaysia','Thailand','Vietnam','Turkey'].map(x=>`<option value="${x}">`).join('')}</datalist>`)}
   ${L('Payment Terms',`<select class="input" id="sp-pt">${o(SUP_TERMS,S.paymentTerms)}</select>`)}
   ${L('Status',`<select class="input" id="sp-st">${o(['Active','Inactive'],S.status)}</select>`)}
  </div></div>
  <div class="modal-foot"><button class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="sup-save" data-id="${isNew?'':pjE(S.id)}">${ic('check')} ${isNew?'Add Supplier':'Save Changes'}</button></div>`);
}
const supRefresh=()=>{if(state.page==='supplier-profile'){const id=state.params&&state.params.id;if(SUPPLIERS.some(x=>x.id===id))renderSupplierProfile();else nav('suppliers');}else renderSuppliers();};
document.addEventListener('input',e=>{if(e.target.id!=='sup-q')return;const q=e.target.value.toLowerCase();document.querySelectorAll('#sup-body tr').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';});});
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action,id=t.dataset.id||(state.params&&state.params.id);
  if(a==='sup-new')supForm(null);
  else if(a==='sup-edit')supForm(SUPPLIERS.find(x=>x.id===id));
  else if(a==='sup-del'){const s=SUPPLIERS.find(x=>x.id===id);if(!s)return;
    const n=PURCHASES.filter(p=>p.supplier===s.name).length;
    openModal(`<div class="modal-head"><h3>Delete Supplier</h3><button class="btn btn-ghost btn-sm" data-action="close-modal">${ic('x')}</button></div><div class="modal-body">${n?`<b>${pjE(s.name)}</b> has ${n} purchase order${n>1?'s':''} and cannot be deleted. You can set its status to Inactive instead.`:`Are you sure you want to delete supplier <b>${s.id} — ${pjE(s.name)}</b>? This action cannot be undone.`}</div><div class="modal-foot"><button class="btn btn-outline" data-action="close-modal">${n?'Close':'Cancel'}</button>${n?'':`<button class="btn btn-danger" data-action="sup-del-yes" data-id="${s.id}">${ic('trash')} Delete</button>`}</div>`,'modal-sm');}
  else if(a==='sup-del-yes'){const i=SUPPLIERS.findIndex(x=>x.id===id);if(i>-1){const n=SUPPLIERS[i].name;SUPPLIERS.splice(i,1);closeModal();toast('Supplier “'+n+'” deleted');if(state.page==='supplier-profile')nav('suppliers');else renderSuppliers();}}
  else if(a==='sup-save'){
    const g=k=>document.getElementById(k).value.trim(),name=g('sp-name'),eid=t.dataset.id;
    if(!name){toast('Supplier name is required');return;}
    if(SUPPLIERS.some(x=>x.id!==eid&&x.name.toLowerCase()===name.toLowerCase())){toast('A supplier named “'+name+'” already exists');return;}
    const em=g('sp-em');if(em&&!/^\S+@\S+\.\S+$/.test(em)){toast('Enter a valid email address');return;}
    const d={name,contact:g('sp-ct'),mobile:g('sp-mob'),email:em,country:g('sp-co')||'Bangladesh',paymentTerms:g('sp-pt'),status:g('sp-st')};
    if(eid){const s=SUPPLIERS.find(x=>x.id===eid);if(s.name!==name)PURCHASES.forEach(p=>{if(p.supplier===s.name)p.supplier=name;});Object.assign(s,d);toast('Supplier updated');}
    else{const n=Math.max(0,...SUPPLIERS.map(x=>parseInt(String(x.id).replace(/\D/g,''))||0))+1;SUPPLIERS.unshift(Object.assign({id:'SUP-'+n,totalPurchase:0,paid:0,due:0},d));toast('Supplier “'+name+'” added');}
    closeModal();supRefresh();
  }
});

function openReport(name){

  else if(name==='Employee Department Report'){cols='<th>Department</th><th>Headcount</th><th>Avg. Salary</th>';rows=DEPTS.map(d=>{const es=EMPLOYEES.filter(e=>e.dept===d);return `<tr><td>${d}</td><td>${es.length}</td><td>${money(Math.round(es.reduce((a,e)=>a+e.salary,0)/(es.length||1)))}</td></tr>`;}).join('');}
  else if(name==='Joining Report'){cols='<th>ID</th><th>Name</th><th>Joining Date</th><th>Department</th>';rows=[...EMPLOYEES].sort((a,b)=>a.join<b.join?1:-1).slice(0,20).map(e=>`<tr><td>${e.id}</td><td>${e.name}</td><td>${e.join}</td><td>${e.dept}</td></tr>`).join('');}
  else if(name==='Employee Salary Report'){cols='<th>ID</th><th>Name</th><th>Designation</th><th>Current Salary</th>';rows=EMPLOYEES.map(e=>`<tr><td>${e.id}</td><td>${e.name}</td><td>${e.desig}</td><td>${money(e.salary)}</td></tr>`).join('');}
  else if(name==='Attendance Report'){cols='<th>Employee</th><th>Date</th><th>Status</th><th>Working Hours</th>';rows=ATTENDANCE.slice(0,25).map(a=>`<tr><td>${a.name}</td><td>${a.date}</td><td>${statusBadge(a.status)}</td><td>${a.hours}</td></tr>`).join('');}
  else if(name==='Leave Report'){cols='<th>Employee</th><th>Type</th><th>Days</th><th>Status</th>';rows=LEAVES.map(l=>`<tr><td>${l.employee}</td><td>${l.type}</td><td>${l.days}</td><td>${statusBadge(l.status)}</td></tr>`).join('');}
  else if(name==='Sales Summary'){cols='<th>Month</th><th>Invoices</th><th>Sales</th>';rows=MONTHS.map((m,i)=>`<tr><td>${m} 2026</td><td>${ri(3,8)}</td><td>${money((18+i)*100000)}</td></tr>`).join('');}
  else if(name==='Sales by Customer'){cols='<th>Customer</th><th>Total Sales</th><th>Total Due</th>';rows=CUSTOMERS.map(c=>`<tr><td>${c.name}</td><td>${money(c.totalSales)}</td><td>${money(c.totalDue)}</td></tr>`).join('');}
  else if(name==='Sales by Product'){cols='<th>Product</th><th>Category</th><th>Units Sold</th><th>Revenue</th>';rows=PRODUCTS.slice(0,20).map(p=>`<tr><td>${p.name}</td><td>${p.cat}</td><td>${ri(5,200)}</td><td>${money(ri(20,400)*1000)}</td></tr>`).join('');}
  else if(name==='Sales by Salesperson'){cols='<th>Salesperson</th><th>Invoices</th><th>Total Sales</th>';rows=EMPLOYEES.filter(e=>e.dept==='Sales & Marketing').map(e=>`<tr><td>${e.name}</td><td>${ri(4,20)}</td><td>${money(ri(200,1800)*1000)}</td></tr>`).join('');}
  else if(name==='Invoice Report'){cols='<th>Invoice</th><th>Customer</th><th>Total</th><th>Status</th>';rows=INVOICES.map(i=>`<tr><td>${i.no}</td><td>${i.customer}</td><td>${money(i.total)}</td><td>${statusBadge(i.payStatus)}</td></tr>`).join('');}
  else if(name==='Outstanding Report'){cols='<th>Customer</th><th>Invoice</th><th>Due</th>';rows=INVOICES.filter(i=>i.dueAmt>0).map(i=>`<tr><td>${i.customer}</td><td>${i.no}</td><td>${money(i.dueAmt)}</td></tr>`).join('');}
  else if(name==='Purchase Summary'){cols='<th>Month</th><th>POs</th><th>Total Purchase</th>';rows=MONTHS.map((m,i)=>`<tr><td>${m} 2026</td><td>${ri(2,5)}</td><td>${money((11+i)*100000)}</td></tr>`).join('');}

  else if(name==='Stock Summary'){cols='<th>Category</th><th>Products</th><th>Total Qty</th><th>Value</th>';rows=CATEGORIES.map(c=>{const ps=PRODUCTS.filter(p=>p.cat===c);return `<tr><td>${c}</td><td>${ps.length}</td><td>${ps.reduce((a,p)=>a+p.stock,0).toLocaleString()}</td><td>${money(ps.reduce((a,p)=>a+p.stock*p.price,0))}</td></tr>`;}).join('');}

  else if(name==='Stock Valuation'){cols='<th>SKU</th><th>Product</th><th>Qty</th><th>Value</th>';rows=PRODUCTS.slice(0,25).map(p=>`<tr><td>${p.sku}</td><td>${p.name}</td><td>${p.stock}</td><td>${money(p.stock*p.price)}</td></tr>`).join('');}
  else if(name==='Product-wise Stock'){cols='<th>SKU</th><th>Product</th><th>Warehouse</th><th>Stock</th>';rows=PRODUCTS.slice(0,25).map(p=>`<tr><td>${p.sku}</td><td>${p.name}</td><td>${p.warehouse}</td><td>${p.stock}</td></tr>`).join('');}
  else if(name==='Profit & Loss'){cols='<th>Head</th><th>Amount</th>';rows=`<tr><td>Total Revenue</td><td>${money(totalIncome)}</td></tr><tr><td>Total Expense</td><td>${money(totalExpense)}</td></tr><tr style="font-weight:800"><td>Net Profit</td><td>${money(totalIncome-totalExpense)}</td></tr>`;}

  else if(name==='General Ledger'){cols='<th>Txn ID</th><th>Date</th><th>Head</th><th>Amount</th>';rows=TXNS.slice(0,25).map(t=>`<tr><td>${t.id}</td><td>${t.date}</td><td>${t.head}</td><td>${money(t.amount)}</td></tr>`).join('');}
  else if(name==='Receivable Aging'){cols='<th>Customer</th><th>0-15 days</th><th>16-30 days</th><th>30+ days</th>';rows=CUSTOMERS.filter(c=>c.totalDue>0).map(c=>`<tr><td>${c.name}</td><td>${money(Math.round(c.totalDue*0.4))}</td><td>${money(Math.round(c.totalDue*0.35))}</td><td>${money(Math.round(c.totalDue*0.25))}</td></tr>`).join('');}
  else if(name==='Payable Aging'){cols='<th>Supplier</th><th>0-15 days</th><th>16-30 days</th><th>30+ days</th>';rows=SUPPLIERS.filter(s=>s.due>0).map(s=>`<tr><td>${s.name}</td><td>${money(Math.round(s.due*0.4))}</td><td>${money(Math.round(s.due*0.35))}</td><td>${money(Math.round(s.due*0.25))}</td></tr>`).join('');}
  else {cols='<th>Info</th>';rows=`<tr><td>Report data will appear here</td></tr>`;}

  openModal(`<div class="modal-head"><h3>${name}</h3><button class="btn btn-ghost btn-sm" data-action="close-modal">${ic('x')}</button></div>
  <div class="modal-body">
    <div class="toolbar"><input class="input" placeholder="From date" style="width:130px;"><input class="input" placeholder="To date" style="width:130px;"><button class="btn btn-outline btn-sm">${ic('filter')} Filter</button></div>

function calc(){if(typeof supSync==='function')supSync();let s=0;document.querySelectorAll('#lines tr').forEach(tr=>{const q=+tr.querySelector('.ql').value||0,r=+tr.querySelector('.rl').value||0;tr.querySelector('.am').textContent=n2(q*r);s+=q*r;});
  const tc=chargesSum(),dv=Math.max(0,+document.getElementById('da').value||0);
  const sub=s+tc,disc=Math.min(sub,dv);
  document.getElementById('sa').textContent=n2(s);document.getElementById('sb').textContent=n2(sub);document.getElementById('tcs').textContent=n2(tc);document.getElementById('ta').textContent=n2(sub-disc);const bd=document.getElementById('bd');if(bd)bd.textContent=n2(Math.max(0,sub-disc-(+bd.dataset.ci||0)));}
