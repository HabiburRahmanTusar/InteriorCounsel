/* ===== Bill form: searchable combos, auto-fill, configurable ===== */
const CFG_KEY='ic_bill_cfg';
const BILL_CFG=Object.assign({allowNewSales:true,allowNewCust:true,allowNewProd:true,includeEmployees:false},(()=>{try{return JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch(e){return {}}})());
const SPDB=[...new Set(BILLS.map(b=>b.sp).filter(Boolean))];
const CUSTDB={};
BILLS.forEach((b,k)=>{if(b.cu&&!CUSTDB[b.cu])CUSTDB[b.cu]={mob:b.mob||('017'+String(10000000+k*7919)),ad:b.ad||''};});
const PRODDB={};
PRODUCTS.forEach(p=>{PRODDB[p.name]={price:p.price,unit:p.unit,sku:p.sku};});
BILLS.forEach(b=>{if(b.prod&&!PRODDB[b.prod])PRODDB[b.prod]={price:Math.max(0,b.tot-b.tr),unit:'',sku:''};});
const spList=()=>BILL_CFG.includeEmployees?[...new Set([...SPDB,...EMPLOYEES.filter(e=>e.dept==='Sales & Marketing').map(e=>e.name)])]:SPDB;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const p2=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const toIso=s=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s||'');return m?`${m[3]}-${m[2]}-${m[1]}`:isoOf(new Date());};
const fromIso=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?`${m[3]}/${m[2]}/${m[1]}`:s;};

function billFields(B,ro,isNew){
  const c=CUSTDB[B.cu]||{};
  if(ro)return fld('Bill Date',B.d,1)+fld('Bill Number',B.no,1)+fld('Salesperson',B.sp,1)+fld('Customer',B.cu,1)+fld('Customer Mobile',B.mob||c.mob,1)+fld('Address',B.ad||c.ad,1);
  const nextNo='A'+(Math.max(0,...BILLS.map(b=>+String(b.no).replace(/\D/g,'')||0))+1);
  const req=' <span style="color:var(--red)">*</span>';
  const cb=(id,v,ph,hint)=>`<div class="cb"><input class="input" id="${id}" autocomplete="off" value="${esc(v)}" placeholder="${ph}" ${v?`data-sel="${esc(v)}"`:''}><div class="cb-list" hidden></div>${hint?`<small class="cb-hint" id="${id}-hint"></small>`:''}</div>`;
  return `<label>Bill Date${req}</label><input class="input" type="date" id="bf-date" value="${isNew?isoOf(new Date()):toIso(B.d)}">
  <label>Bill Number${req}</label><input class="input" id="bf-no" value="${esc(isNew?nextNo:B.no)}">
  <label>Salesperson${req}</label>${cb('bf-sp',B.sp,'Select or type to search…')}
  <label>Customer${req}</label>${cb('bf-cu',B.cu,'Select or type to search…',1)}
  <label>Customer Mobile</label><input class="input" id="bf-mob" value="${esc(B.mob||c.mob)}" placeholder="01XXX-XXXXXX">
  <label>Address</label><input class="input" id="bf-ad" value="${esc(B.ad||c.ad)}" placeholder="Customer address">`;
}
const cbKind=inp=>inp.id==='bf-sp'?'sp':inp.id==='bf-cu'?'cu':'pr';
function cbDraw(inp){
  const kind=cbKind(inp),list=inp.parentNode.querySelector('.cb-list'),q=inp.value.trim(),ql=q.toLowerCase();
  const names=kind==='sp'?spList():kind==='cu'?Object.keys(CUSTDB):Object.keys(PRODDB);
  const m=names.filter(n=>!ql||n.toLowerCase().includes(ql)).sort((a,b)=>a.localeCompare(b)).slice(0,50);
  const allow=kind==='sp'?BILL_CFG.allowNewSales:kind==='cu'?BILL_CFG.allowNewCust:BILL_CFG.allowNewProd;
  const canNew=allow&&q&&!names.some(n=>n.toLowerCase()===ql);
  let h=m.map(n=>`<div class="cb-opt" data-v="${esc(n)}">${esc(n)}${kind==='pr'&&PRODDB[n]?`<small>৳ ${n2(PRODDB[n].price)}${PRODDB[n].unit?' / '+esc(PRODDB[n].unit):''}</small>`:''}${kind==='cu'&&CUSTDB[n]?`<small>${esc(CUSTDB[n].mob)}${CUSTDB[n].ad?' · '+esc(CUSTDB[n].ad):''}</small>`:''}</div>`).join('');
  if(canNew)h+=`<div class="cb-opt cb-new" data-new="1" data-v="${esc(q)}">＋ Create ${kind==='sp'?'salesperson':kind==='cu'?'customer':'product'} “${esc(q)}”</div>`;
  if(!h)h=`<div class="cb-empty">No match${allow?'':' — creating new records is turned off (Configure)'}</div>`;
  list.innerHTML=h;list.hidden=false;
  if(kind==='pr'){const r=inp.getBoundingClientRect();Object.assign(list.style,{position:'fixed',left:r.left+'px',top:(r.bottom+4)+'px',width:Math.max(r.width,300)+'px',right:'auto'});}
}
function cbHideAll(except){document.querySelectorAll('.cb-list').forEach(l=>{if(l.parentNode!==except)l.hidden=true;});}
function cbPick(inp,name,isNew){
  const kind=cbKind(inp),hint=inp.parentNode.querySelector('.cb-hint');
  inp.value=name;inp.dataset.sel=name;inp.parentNode.querySelector('.cb-list').hidden=true;
  if(kind==='sp'){if(isNew){SPDB.push(name);toast('Salesperson “'+name+'” created');}return;}
  if(kind==='pr'){const tr=inp.closest('tr'),rl=tr.querySelector('.rl'),ql=tr.querySelector('.ql');
    if(!(+ql.value>0))ql.value=1;
    if(isNew){PRODDB[name]={price:0,unit:'',sku:''};rl.value='';hint.textContent='New product — enter the rate; saved when the bill is posted';hint.className='cb-hint new';rl.focus();}
    else{const p=PRODDB[name];rl.value=p.price;hint.textContent='Price from product list: ৳ '+n2(p.price)+(p.unit?' / '+p.unit:'');hint.className='cb-hint ok';}
    calc();return;}
  const mob=document.getElementById('bf-mob'),ad=document.getElementById('bf-ad');
  if(isNew){CUSTDB[name]={mob:'',ad:''};mob.value='';ad.value='';hint.textContent='New customer — enter mobile & address; saved with this bill';hint.className='cb-hint new';mob.focus();}
  else{const c=CUSTDB[name]||{};mob.value=c.mob||'';ad.value=c.ad||'';hint.textContent='Existing customer — mobile & address filled';hint.className='cb-hint ok';}
}
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('.cb input')){cbHideAll(e.target.parentNode);cbDraw(e.target);}});
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('.cb input')){if(e.target.dataset.sel!==e.target.value)delete e.target.dataset.sel;cbDraw(e.target);}});
document.addEventListener('mousedown',e=>{
  const o=e.target.closest&&e.target.closest('.cb-opt');
  if(o){e.preventDefault();cbPick(o.closest('.cb').querySelector('input'),o.dataset.v,!!o.dataset.new);}
  else if(!(e.target.closest&&e.target.closest('.cb')))cbHideAll();
});
document.addEventListener('focusout',e=>{
  const inp=e.target;if(!(inp.matches&&inp.matches('.cb input')))return;
  const kind=cbKind(inp),names=kind==='sp'?spList():kind==='cu'?Object.keys(CUSTDB):Object.keys(PRODDB),hit=names.find(n=>n.toLowerCase()===inp.value.trim().toLowerCase());
  if(hit&&inp.dataset.sel!==hit)cbPick(inp,hit,false);
  setTimeout(()=>{const l=inp.parentNode&&inp.parentNode.querySelector('.cb-list');if(l)l.hidden=true;},120);
});
document.addEventListener('keydown',e=>{
  const inp=e.target;if(!(inp.matches&&inp.matches('.cb input')))return;
  const list=inp.parentNode.querySelector('.cb-list'),opts=[...list.querySelectorAll('.cb-opt')];let i=opts.findIndex(o=>o.classList.contains('hl'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(list.hidden)cbDraw(inp);else{opts.forEach(o=>o.classList.remove('hl'));i=e.key==='ArrowDown'?Math.min(opts.length-1,i+1):Math.max(0,i-1);if(opts[i]){opts[i].classList.add('hl');opts[i].scrollIntoView({block:'nearest'});}}}
  else if(e.key==='Enter'){const o=opts[i>=0?i:0];if(!list.hidden&&o){e.preventDefault();cbPick(inp,o.dataset.v,!!o.dataset.new);}}
  else if(e.key==='Escape')list.hidden=true;
});
window.addEventListener('scroll',()=>{if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.pcb'))cbHideAll();},true);
function openBillCfg(){
  const row=(id,l,d)=>`<label style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer"><input type="checkbox" id="${id}" ${BILL_CFG[id]?'checked':''} style="margin-top:3px"><span><b style="font-size:13px">${l}</b><br><small style="color:var(--text-muted)">${d}</small></span></label>`;
  openModal(`<div class="modal-head"><h3>Bill Form Settings</h3><button class="btn btn-ghost btn-sm" data-action="close-modal">${ic('x')}</button></div><div class="modal-body">
  ${row('allowNewSales','Allow creating new Salesperson from the bill form','When the typed name is not found, a “Create” option appears in the dropdown.')}
  ${row('allowNewCust','Allow creating new Customer from the bill form','New customers are saved with their mobile & address when the bill is posted.')}
  ${row('allowNewProd','Allow creating new Product from the bill form','Products not in the list can be added on the fly; their rate is saved for next time.')}

document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;
  if(t.dataset.action==='bill-cfg')openBillCfg();
  else if(t.dataset.action==='bill-cfg-save'){['allowNewSales','allowNewCust','allowNewProd','includeEmployees'].forEach(k=>BILL_CFG[k]=document.getElementById(k).checked);try{localStorage.setItem(CFG_KEY,JSON.stringify(BILL_CFG));}catch(x){}closeModal();toast('Settings saved');}
});

/* ===== Bill form: SUPPLIER INFORMATION (per product: supplier + supplier invoice no.; new supplier created from here) ===== */
const supNames=()=>[...new Set(SUPPLIERS.map(x=>x.name).concat((typeof GV!=='undefined'?GV:[]).map(x=>x.name)))];
const supFind=n=>{const q=String(n||'').trim().toLowerCase();return q?supNames().find(x=>x.toLowerCase()===q):undefined;};
let supNewCnt=0;
const supCreate=n=>{n=String(n||'').trim();if(!n)return null;const q=n.toLowerCase(),ex=SUPPLIERS.find(x=>x.name.toLowerCase()===q);if(ex)return ex.name;
  const g=(typeof GV!=='undefined'?GV:[]).find(x=>x.name.toLowerCase()===q),nm=g?g.name:n;
  const id=Math.max(0,...SUPPLIERS.map(x=>parseInt(String(x.id).replace(/\D/g,''))||0))+1;
  SUPPLIERS.unshift({id:'SUP-'+id,name:nm,contact:'',country:'Bangladesh',mobile:g?(g.mob||''):'',email:'',paymentTerms:'Net 30',totalPurchase:0,paid:0,due:0,status:'Active',invoices:[]});supNewCnt++;return nm;};
/* link supplier invoices to the Suppliers menu (rebuilt per bill on every post/save/delete) */
const supRecord=(no,lines,date)=>{
  SUPPLIERS.forEach(s=>{if(Array.isArray(s.invoices))s.invoices=s.invoices.filter(i=>i.bill!==no);});
  (lines||[]).forEach(l=>{if(!l.vn)return;const s=SUPPLIERS.find(x=>x.name===l.vn);if(!s)return;(s.invoices=s.invoices||[]).push({inv:l.sinv||'',bill:no,date:date||'',product:l.p,qty:l.q,amount:l.pa||0,disc:Math.min(l.pa||0,l.sd||0)});});
  SUPPLIERS.forEach(s=>{if(Array.isArray(s.invoices)){s.totalPurchase=s.invoices.reduce((a,i)=>a+Math.max(0,(i.amount||0)-(i.disc||0)),0);s.due=Math.max(0,s.totalPurchase-(s.paid||0));}});
};
function supSection(){
  return `<div class="section-title" style="margin-top:26px">SUPPLIER INFORMATION</div>
   <div class="table-wrap"><table><thead><tr><th style="width:56px;white-space:normal">Serial Number</th><th>Particulars</th><th style="width:58px">Quantity</th><th style="width:70px">Rate</th><th class="num" style="width:84px">Amount</th><th style="min-width:190px">Supplier Name</th><th style="min-width:130px;white-space:normal">Supplier Invoice No.</th><th class="num" style="min-width:110px;white-space:normal">Purchase Amount</th><th class="num" style="min-width:100px;white-space:normal">Supplier Discount</th><th class="num" style="min-width:110px;white-space:normal">Net Purchase</th></tr></thead><tbody id="sup-lines"></tbody></table></div>
   <div style="display:flex;justify-content:flex-end;gap:14px;padding:8px 4px 0;font-size:13px"><span style="color:var(--text-muted)">Total Purchase Amount</span><b id="sup-pt">0.00</b></div>
   <div style="display:flex;justify-content:flex-end;gap:14px;padding:4px 4px 0;font-size:13px"><span style="color:var(--text-muted)">Supplier Discount (given from Suppliers menu)</span><b id="sup-dt" style="color:var(--green)">0.00</b></div>

function supBadge(v){v=(v||'').trim();if(!v)return '';
  return supFind(v)?`<span class="badge badge-green"><span class="d"></span>Existing</span>`:`<span class="badge badge-amber"><span class="d"></span>New</span> <a style="color:var(--blue);cursor:pointer;font-size:12px" data-action="sup-create">＋ Create</a>`;}
const supTotal=()=>{const el=document.getElementById('sup-pt');if(!el)return;let g=0,d=0;document.querySelectorAll('#lines tr').forEach(tr=>{const pa=+(tr._sup&&tr._sup.pa)||0;g+=pa;d+=Math.min(pa,+(tr._sup&&tr._sup.sd)||0);});el.textContent=n2(g);const de=document.getElementById('sup-dt'),ne=document.getElementById('sup-nt');if(de)de.textContent=n2(d);if(ne)ne.textContent=n2(g-d);};
const supSetBd=(row,v)=>{const bd=row.querySelector('.sup-bd'),h=supBadge(v);if(bd.dataset.k!==h){bd.innerHTML=h;bd.dataset.k=h;}};
function supSync(){
  const tb=document.getElementById('sup-lines');if(!tb)return;
  const dl=document.getElementById('sup-dl');if(dl)dl.innerHTML=supNames().map(n=>`<option value="${esc(n)}">`).join('');
  const trs=[...document.querySelectorAll('#lines tr')];
  while(tb.children.length>trs.length)tb.lastElementChild.remove();
  while(tb.children.length<trs.length)tb.insertAdjacentHTML('beforeend',`<tr><td class="sn"></td><td class="sp"></td><td class="sq"></td><td class="sr"></td><td class="num sa"></td><td><input class="input sup-vn" list="sup-dl" autocomplete="off" placeholder="Select or type supplier…" style="width:100%"><div class="sup-bd" style="margin-top:4px;min-height:0"></div></td><td><input class="input sup-inv" placeholder="Invoice no." style="width:100%"></td><td><input class="input num sup-pa" type="number" min="0" step="0.01" placeholder="0.00" style="width:100%"></td><td class="num ssd"></td><td class="num snp"></td></tr>`);
  trs.forEach((tr,i)=>{const row=tb.children[i],q=+tr.querySelector('.ql').value||0,r=+tr.querySelector('.rl').value||0,sd=tr._sup||(tr._sup={vn:'',inv:''});
    row.querySelector('.sn').textContent=i+1;row.querySelector('.sp').textContent=tr.querySelector('.pin').value||'—';
    row.querySelector('.sq').textContent=q;row.querySelector('.sr').textContent=n2(r);row.querySelector('.sa').textContent=n2(q*r);
    const vn=row.querySelector('.sup-vn'),iv=row.querySelector('.sup-inv');
    if(document.activeElement!==vn)vn.value=sd.vn;if(document.activeElement!==iv)iv.value=sd.inv;const pa=row.querySelector('.sup-pa');if(document.activeElement!==pa)pa.value=sd.pa||'';
    supSetBd(row,sd.vn);
    const sdv=Math.min(+sd.pa||0,+sd.sd||0);row.querySelector('.ssd').innerHTML=sdv?`<span style="color:var(--green)">- ${n2(sdv)}</span>`:'—';row.querySelector('.snp').textContent=n2(Math.max(0,(+sd.pa||0)-sdv));});
  supTotal();
}
function supInit(B){
  if(!document.getElementById('sup-lines'))return;
  [...document.querySelectorAll('#lines tr')].forEach((tr,i)=>{const l=(B&&B.lines&&B.lines[i])||{};tr._sup={vn:l.vn||'',inv:l.sinv||'',pa:l.pa||'',sd:l.sd||0};});
  supSync();
}
document.addEventListener('input',e=>{const t=e.target;if(!t.classList||!(t.classList.contains('sup-vn')||t.classList.contains('sup-inv')||t.classList.contains('sup-pa')))return;
  const row=t.closest('tr'),tb=document.getElementById('sup-lines');if(!row||!tb)return;

  tr._sup=tr._sup||{vn:'',inv:''};
  if(t.classList.contains('sup-vn')){tr._sup.vn=t.value;supSetBd(row,t.value);}else if(t.classList.contains('sup-pa')){tr._sup.pa=t.value;const _sdv=Math.min(+t.value||0,+tr._sup.sd||0),_np=row.querySelector('.snp'),_ds=row.querySelector('.ssd');if(_np)_np.textContent=n2(Math.max(0,(+t.value||0)-_sdv));if(_ds)_ds.innerHTML=_sdv?`<span style="color:var(--green)">- ${n2(_sdv)}</span>`:'—';supTotal();}else tr._sup.inv=t.value;});
document.addEventListener('change',e=>{const t=e.target;if(!t.classList||!t.classList.contains('sup-vn'))return;
  const ex=supFind(t.value);if(ex){t.value=ex;const row=t.closest('tr'),i=[...row.parentNode.children].indexOf(row),tr=document.querySelectorAll('#lines tr')[i];if(tr&&tr._sup)tr._sup.vn=ex;supSetBd(row,ex);}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-action="sup-create"]');if(!t)return;
  const row=t.closest('tr'),inp=row.querySelector('.sup-vn'),n=supCreate(inp.value);if(!n)return;
  inp.value=n;const i=[...row.parentNode.children].indexOf(row),tr=document.querySelectorAll('#lines tr')[i];if(tr&&tr._sup)tr._sup.vn=n;
  supSync();toast('Supplier “'+n+'” created');});

function readBillForm(){
  const g=id=>document.getElementById(id).value.trim();
  const d=g('bf-date'),no=g('bf-no');let sp=g('bf-sp'),cu=g('bf-cu');
  if(!d){toast('Bill date is required');return null;}
  if(!no){toast('Bill number is required');return null;}
  if(!sp){toast('Please select a salesperson');return null;}
  if(!cu){toast('Please select a customer');return null;}
  const sh=spList().find(n=>n.toLowerCase()===sp.toLowerCase()),ch=Object.keys(CUSTDB).find(n=>n.toLowerCase()===cu.toLowerCase());
  if(!sh&&!BILL_CFG.allowNewSales){toast('Salesperson not found — pick one from the list');return null;}
  if(!ch&&!BILL_CFG.allowNewCust){toast('Customer not found — pick one from the list');return null;}
  if(sh)sp=sh;else SPDB.push(sp);
  if(ch)cu=ch;
  CUSTDB[cu]=Object.assign(CUSTDB[cu]||{},{mob:g('bf-mob'),ad:g('bf-ad')});

function taka(n){n=Math.round(Math.abs(n));if(!n)return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:t[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  const parts=[[10000000,'Crore'],[100000,'Lakh'],[1000,'Thousand']];let o=[];
  parts.forEach(([v,l])=>{if(n>=v){const q=Math.floor(n/v);o.push(three(q)+' '+l);n%=v;}});
  if(n)o.push(three(n));return o.join(' ');}

/* find (or create) the Vendor Bill that Cash Out pays against, and reduce what is payable */
function sdVB(b,s,g,lines,amt,prev,gross){
  let vb=VB.find(v=>v.main===g.bill&&v.vn===s.name&&String(v.ref||'')===(g.inv||''));
  if(!vb){vb={id:Date.now()+1,d:b.d,main:g.bill,sp:'',rs:'',vn:s.name,ref:g.inv||'',mob:s.mobile||'',note:'Created from supplier discount',tot:sdR2(gross-prev),paid:0,lines:lines.map(l=>({p:l.p,q:l.q,r:l.q?sdR2(l.pa/l.q):l.pa})),disc:0,sdisc:prev};VB.unshift(vb);}
  vb.tot=Math.max(0,sdR2(vb.tot-amt));vb.sdisc=sdR2((vb.sdisc||0)+amt);return vb;
}
const sdSetPu=b=>{b.pu=sdR2((b.lines||[]).reduce((a,l)=>a+Math.max(0,(l.pa||0)-(l.sd||0)),0));};
function supDiscApply(){
  const s=SUPPLIERS.find(x=>x.id===SD.sid),g=SD.groups[+(document.getElementById('sd-sel')||{}).value];if(!s||!g)return;
  const type=document.getElementById('sd-type').value,val=+document.getElementById('sd-val').value||0,date=document.getElementById('sd-date').value.trim(),note=document.getElementById('sd-note').value.trim();
  const b=BILLS.find(x=>x.no===g.bill);
  if(!b){toast('Bill '+g.bill+' not found');return;}
  if(!(val>0)){toast('Enter a discount value');return;}
  if(type==='Percent'&&val>100){toast('Percent cannot be more than 100');return;}
  if(!date){toast('Date is required');return;}
  const ls=(b.lines||[]).map((l,i)=>({l,i})).filter(x=>x.l.vn===s.name&&(x.l.sinv||'')===(g.inv||'')&&(x.l.pa||0)>0);
  if(!ls.length){toast('Supplier part of bill '+g.bill+' not found');return;}
  const gross=sdR2(ls.reduce((a,x)=>a+x.l.pa,0)),prev=sdR2(ls.reduce((a,x)=>a+(x.l.sd||0),0)),rem=sdR2(gross-prev);
  const amt=type==='Percent'?sdR2(gross*val/100):sdR2(val);
  if(!(amt>0)){toast('Discount amount must be greater than 0');return;}
  if(amt>rem+0.001){toast('Discount ('+n2(amt)+') is more than the remaining purchase amount ('+n2(rem)+')');return;}
  /* spread across the bill's lines of this supplier invoice, proportional to what is still open */
  let left=amt;const parts=[];
  ls.forEach(x=>{if(left<=0)return;const r=sdR2(x.l.pa-(x.l.sd||0)),a=Math.min(r,left);if(a>0){x.l.sd=sdR2((x.l.sd||0)+a);left=sdR2(left-a);parts.push({i:x.i,a});}});
  sdSetPu(b);
  sdVB(b,s,g,ls.map(x=>x.l),amt,prev,gross);
  (s.discounts=s.discounts||[]).push({id:Date.now(),date,bill:g.bill,inv:g.inv||'',type,value:val,amount:amt,note,parts});
  supRecord(b.no,b.lines,b.d);
  closeModal();toast('Discount ৳ '+n2(amt)+' adjusted on bill '+g.bill+(g.inv?' (Ref '+g.inv+')':''));supRefresh();
}
function supDiscReverse(sid,did){
  const s=SUPPLIERS.find(x=>x.id===sid),d=s&&(s.discounts||[]).find(x=>String(x.id)===String(did));if(!d)return;
  const b=BILLS.find(x=>x.no===d.bill);
  if(b){(d.parts||[]).forEach(p=>{const l=(b.lines||[])[p.i];if(l&&l.vn===s.name)l.sd=Math.max(0,sdR2((l.sd||0)-p.a));});sdSetPu(b);supRecord(b.no,b.lines,b.d);}

}

function bnAttach(inp,list,items,onChange,newLabel,onNew){
  const draw=()=>{const q=inp.value.trim(),ql=q.toLowerCase(),all=items();
    let h=all.filter(i=>!ql||(i.v+' '+i.t).toLowerCase().includes(ql)).slice(0,50).map(i=>`<div class="bn-opt${i.dis?' dis':''}" data-v="${esc(i.v)}">${esc(i.v)} — ${esc(i.t)}<small>${esc(i.s)}</small></div>`).join('');
    if(onNew&&q&&!all.some(i=>i.v.toLowerCase()===ql))h+=`<div class="bn-opt new" data-new="1">＋ ${newLabel} “${esc(q)}”</div>`;
    list.innerHTML=h||'<div class="bn-empty">No match</div>';list.hidden=false;};
  const pick=o=>{if(!o||o.classList.contains('dis'))return;list.hidden=true;if(o.dataset.new){onNew(inp.value.trim());return;}inp.value=o.dataset.v;onChange();};
  inp.addEventListener('focus',draw);
  inp.addEventListener('input',()=>{draw();onChange();});
  inp.addEventListener('blur',()=>setTimeout(()=>{list.hidden=true;},150));
  inp.addEventListener('keydown',e=>{const o=[...list.querySelectorAll('.bn-opt:not(.dis)')];let i=o.findIndex(x=>x.classList.contains('hl'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(list.hidden)draw();else{o.forEach(x=>x.classList.remove('hl'));i=e.key==='ArrowDown'?Math.min(o.length-1,i+1):Math.max(0,i-1);if(o[i]){o[i].classList.add('hl');o[i].scrollIntoView({block:'nearest'});}}}
    else if(e.key==='Enter'&&!list.hidden){e.preventDefault();pick(o[i>=0?i:0]);}else if(e.key==='Escape')list.hidden=true;});
  list.addEventListener('mousedown',e=>{e.preventDefault();pick(e.target.closest('.bn-opt'));});
}

/* ---- attendance helpers ---- */
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);

const fmtIso=iso=>{const p=iso.split('-').map(Number);return fmtDate(new Date(p[0],p[1]-1,p[2]));};

const to12=t=>{const p=t.split(':').map(Number);const ap=p[0]>=12?'PM':'AM';return pad(p[0]%12||12,2)+':'+pad(p[1],2)+' '+ap;};

function addDate(iso){const p=iso.split('-').map(Number),dt=new Date(p[0],p[1]-1,p[2]);if(!ATT_DATES.some(x=>fmtDate(x)===fmtDate(dt))){ATT_DATES.push(dt);ATT_DATES.sort((a,b)=>b-a);}}
function put(r){const i=ATTENDANCE.findIndex(a=>a.empId===r.empId&&a.date===r.date);if(i>-1)ATTENDANCE[i]=r;else ATTENDANCE.push(r);addDate(r.iso);}

function keyOf(p){
  const m={'employee-profile':'employees','customer-profile':'customers','supplier-profile':'suppliers','project-profile':'projects'};

  if(/^sales-/.test(p))return ['sales'];

  const emp=$('ma-emp').value, iso=$('ma-date').value;
  const r=emp&&iso?ATTENDANCE.find(a=>a.empId===emp&&a.date===fmtIso(iso)):null;
  $('ma-in').value=r?to24(r.checkIn):''; $('ma-out').value=r?to24(r.checkOut):'';
  $('ma-status').value=r&&(r.status==='Absent'||r.status==='On Leave')?r.status:'Auto'; $('ma-note').value=(r&&r.note)||'';
  $('ma-hint').textContent=r?`Existing record: ${r.status} · In ${r.checkIn} · Out ${r.checkOut}. Saving will update it.`:(emp?'No attendance on this date yet — saving will create it.':'');
}
function maSave(){
  const emp=$('ma-emp').value, iso=$('ma-date').value; let st=$('ma-status').value, ci=$('ma-in').value, co=$('ma-out').value;
  const e=EMPLOYEES.find(x=>x.id===emp);
  if(!e||!iso){toast('Please select an employee and a date');return;}
  if(iso>tIso){toast('Attendance cannot be added for a future date');return;}
  let r;
  if(st==='Absent'||st==='On Leave') r={checkIn:'-',checkOut:'-',hours:'0h',late:'-',ot:'-',status:st};
  else{
    if(!ci||!co){toast('Enter both check-in and check-out time');return;}
    if(mins(co)<=mins(ci)){toast('Check-out must be after check-in');return;}
    const work=mins(co)-mins(ci), late=window.ICHR?ICHR.isLate(ci):mins(ci)>555;
    r={checkIn:to12(ci),checkOut:to12(co),hours:hm(work),late:late?'Yes':'No',ot:hm(Math.max(0,mins(co)-1080)),status:st==='Auto'?(work<300?'Half Day':late?'Late':'Present'):st};
  }
  r=Object.assign({empId:e.id,name:e.name,dept:e.dept,date:fmtIso(iso),iso:iso,note:$('ma-note').value.trim(),by:cur?cur.name:'',at:Date.now(),manual:true},r);
  DB.manual=DB.manual.filter(x=>!(x.empId===r.empId&&x.iso===iso)); DB.manual.push(r); put(r); save();
  state.params.emp=emp; state.params.date=iso; renderManual(); toast('Attendance saved for '+e.name+' ('+r.date+')');
}

/* ---- Attendance page: wire the existing buttons to the new form ---- */
const _ra=window.renderAttendance;
window.renderAttendance=RENDERERS.attendance=function(){
  _ra(); const pc=$('page-content'), ok=has('manual-attendance'), ds=($('att-date')||{}).value;
  pc.querySelectorAll('[data-msg="Manual attendance saved"]').forEach(b=>{if(ok){b.dataset.action='nav';b.dataset.page='manual-attendance';}else b.remove();});
  pc.querySelectorAll('tbody tr').forEach(tr=>{const b=tr.querySelector('[data-msg^="Editing attendance"]');if(!b)return;
    if(!ok){b.remove();return;} b.removeAttribute('data-msg'); b.dataset.action='ma-edit'; b.dataset.emp=tr.cells[0].textContent.trim(); b.dataset.date=ds;});
};
RENDERERS['manual-attendance']=renderManual; RENDERERS.access=renderAccess;

/* ---- Settings > Users / Roles now point to Access Control ---- */
const _sp=window.settingsPanel;
window.settingsPanel=function(it){
  if(it==='Users'||it==='Roles'||it==='Permissions'){
    const tab=it==='Users'?'users':'roles';
    return `<div class="section-title">${ic('userCheck')} ${it}</div><p style="color:var(--text-muted)">Manage users, roles and menu-wise access in Access Control.</p><button class="btn btn-primary" data-action="rb-open" data-tab="${tab}">Open Access Control</button>`;
  }
  return _sp(it);
};

/* ---- events ---- */
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='u-role'||t.id==='u-custom'){const c=$('u-custom').checked; if(!c)$('u-grid').innerHTML=grid(rset(roleOf($('u-role').value)),true); else $('u-grid').querySelectorAll('input').forEach(i=>i.disabled=false);}
  if(t.matches&&t.matches('.rb-grid input[data-k]'))cascade(t);
  if(t.id==='ma-emp'||t.id==='ma-date'){state.params.emp=$('ma-emp').value;maFill();}
  if(t.id==='ma-filter'){state.params.filter=t.value;state.params.emp=$('ma-emp').value;state.params.date=$('ma-date').value;renderManual();}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]'); if(!t)return; const a=t.dataset.action, d=t.dataset;
  if(a==='rb-login')doLogin();
  else if(a==='rb-open'){window.nav('access',{tab:d.tab});}
  else if(a==='rb-tab'){state.params.tab=d.tab;renderAccess();}
  else if(a==='rb-user')userForm(d.id||null);
  else if(a==='rb-role')roleForm(d.id||null);
  else if(a==='rb-user-save'){
    const id=$('rb-uf').dataset.id,name=$('u-name').value.trim(),email=$('u-email').value.trim(),pw=$('u-pw').value,role=$('u-role').value,status=$('u-status').value;
    if(!name||!email||!pw){toast('Name, email and password are required');return;}
    if(DB.users.some(x=>x.email.toLowerCase()===email.toLowerCase()&&x.id!==id)){toast('This email is already in use');return;}
    if(cur&&cur.id===id&&status!=='Active'){toast('You cannot deactivate your own account');return;}
    const menus=$('u-custom').checked&&!roleOf(role).all?picked($('u-grid')):null;
    const rec={id:id||'U'+Date.now(),name,email,pw,role,menus,status}, i=DB.users.findIndex(x=>x.id===id);
    if(i>-1){Object.assign(DB.users[i],rec);}else DB.users.push(rec);
    closeModal(); refreshAfter(); toast('User saved');
    if(cur&&!canPage(state.page)){const f=first();if(f)window.nav(f);}
  }
  else if(a==='rb-role-save'){
    const old=$('rb-rf').dataset.old,name=$('r-name').value.trim();
    if(!name){toast('Role name is required');return;}
    if(DB.roles.some(r=>r.name.toLowerCase()===name.toLowerCase()&&r.name!==old)){toast('This role already exists');return;}
    const menus=picked($('rb-rf')), r=roleOf(old);
    if(r){DB.users.forEach(u=>{if(u.role===old)u.role=name;});r.name=name;r.menus=menus;}else DB.roles.push({name,menus});
    closeModal(); refreshAfter(); toast('Role saved');
    if(cur&&!canPage(state.page)){const f=first();if(f)window.nav(f);}
  }
  else if(a==='rb-del'){
    if(d.kind==='user'&&cur&&cur.id===d.id){toast('You cannot delete your own account');return;}
    if(d.kind==='role'&&DB.users.some(u=>u.role===d.id)){toast('Cannot delete: users are assigned to this role');return;}
    openModal(`${mHead('Delete '+d.kind)}<div class="modal-body">Delete this ${d.kind}: <b>${esc(d.kind==='user'?(DB.users.find(u=>u.id===d.id)||{}).name:d.id)}</b>?</div><div class="modal-foot"><button class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="rb-del-yes" data-kind="${d.kind}" data-id="${esc(d.id)}">${ic('trash')} Delete</button></div>`);
  }
  else if(a==='rb-del-yes'){if(d.kind==='user')DB.users=DB.users.filter(u=>u.id!==d.id);else DB.roles=DB.roles.filter(r=>r.name!==d.id);closeModal();refreshAfter();toast('Deleted');}
  else if(a==='ma-save')maSave();
  else if(a==='ma-clear'){state.params.emp='';renderManual();}
  else if(a==='ma-edit'){window.nav('manual-attendance',{emp:d.emp,date:isoFromStr(d.date)});}
  else if(a==='ma-del'){DB.manual=DB.manual.filter(x=>!(x.empId===d.emp&&x.iso===d.iso));const k=ATTENDANCE.findIndex(x=>x.empId===d.emp&&x.iso===d.iso);if(k>-1)ATTENDANCE.splice(k,1);save();renderManual();toast('Manual entry removed');}
});

window.ICAuth={user:()=>cur,roles:()=>DB.roles,can:k=>has(k)};
/* ---- start: restore session or ask to sign in ---- */
let sid=null; try{sid=localStorage.getItem(SKEY);}catch(e){}
const su=DB.users.find(u=>u.id===sid&&u.status==='Active');
if(su)start(su); else showLogin();
})();
</script>
</body>
</html>
