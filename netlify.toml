[build]
  command = "npm --workspace @wfm/admin-portal run build"
  publish = "apps/admin-portal/dist/admin-portal/browser"

# Proxy /api requests to live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://attendly-akxa.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
